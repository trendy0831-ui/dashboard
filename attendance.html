<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>출결·숙제 체크 | 이끌림수학학원</title>
<link rel="apple-touch-icon" href="assets/logo-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="출결체크">
<meta name="theme-color" content="#018875">
<style>
  :root{
    --teal:#018875;
    --teal-dark:#016A5B;
    --blue:#027A94;
    --green:#AACD98;
    --yellow:#F2DE97;
    --ink:#173B33;
    --ink-soft:#5C7A72;
    --paper:#EFF6F2;
    --card:#FFFFFF;
    --line:#D7E5DE;
    --amber:#B8860B;
    --red:#C0463A;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-tap-highlight-color:transparent;}

  #topbar{background:var(--teal);color:#fff;padding:12px 16px;
    display:flex;align-items:center;gap:10px;}
  .header-logo{width:32px;height:30px;object-fit:contain;flex-shrink:0;display:block;
    background:#fff;border-radius:8px;padding:3px;}
  #topbar h1{font-size:14.5px;font-weight:700;margin:0;letter-spacing:-0.2px;white-space:nowrap;}
  #topbar .sub{font-size:10.5px;color:#DDF2EC;margin-top:2px;}
  .sync-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);
    margin-right:5px;vertical-align:1px;}
  .sync-dot.busy{background:var(--yellow);}

  #app{max-width:560px;margin:0 auto;padding:0 0 40px;}


  .weekbar{display:flex;align-items:center;justify-content:space-between;
    background:var(--card);border-bottom:1px solid var(--line);
    padding:10px 14px;}
  .weekbar button{background:var(--paper);border:1px solid var(--line);font-size:18px;color:#018875;
    padding:6px 10px;cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center;}
  .weekbar button svg{width:18px;height:18px;display:block;}
  .weekbar .range{font-size:13.5px;font-weight:600;}

  .toolbar{padding:10px 14px 0;}
  .toolbar button{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:9px 0;font-size:13px;color:var(--ink);cursor:pointer;}
  .toolbar button.active{background:var(--teal);color:#fff;border-color:var(--teal);}

  .section-tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line);}
  .section-tab{flex:1;padding:12px 0;text-align:center;font-size:13.5px;font-weight:700;
    color:var(--ink-soft);background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;}
  .section-tab.active{color:var(--teal-dark);border-bottom-color:var(--teal);}

  .hw-status-btn{flex:1;display:flex;align-items:center;justify-content:space-between;
    background:transparent;border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;font-family:inherit;cursor:pointer;text-align:left;}
  .hw-name{font-size:14px;font-weight:600;color:var(--ink);}
  .hw-status-label{font-size:12px;font-weight:700;color:var(--ink-soft);}
  .hw-status-btn.done{background:var(--teal);border-color:var(--teal);}
  .hw-status-btn.done .hw-name,.hw-status-btn.done .hw-status-label{color:#fff;}
  .hw-status-btn.missing{border:2px solid var(--amber);}
  .hw-status-btn.missing .hw-status-label{color:var(--amber);}
  .hw-status-btn.unchecked{border-style:dashed;}

  .body-row{display:flex;}

  .daytabs{display:flex;flex-direction:column;background:var(--card);
    border-right:1px solid var(--line);flex-shrink:0;width:52px;}
  .daytab{padding:14px 0;text-align:center;font-size:13px;font-weight:600;color:var(--ink-soft);
    cursor:pointer;border-left:3px solid transparent;background:none;border-top:none;border-right:none;border-bottom:none;
    display:flex;flex-direction:column;align-items:center;gap:2px;}
  .daytab .d{font-size:9.5px;color:var(--ink-soft);font-weight:400;}
  .daytab.active{background:var(--paper);color:var(--teal-dark);border-left-color:var(--teal);}
  .daytab.today .day-dot{width:4px;height:4px;border-radius:50%;background:var(--blue);margin-top:1px;}
  .daytab.holiday span:not(.holiday-name),.daytab.holiday .d{color:var(--red);}
  .daytab.holiday.active{background:#FBEAE7;}
  .holiday-name{font-size:8.5px;color:var(--red);font-weight:400;line-height:1.2;
    max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .daypanel{flex:1;padding:12px 12px 20px;min-width:0;}
  .hint{font-size:11px;color:var(--ink-soft);margin-bottom:10px;line-height:1.5;}

  .time-label{font-size:11.5px;color:var(--teal-dark);font-weight:700;margin:12px 0 6px;}
  .time-label:first-child{margin-top:0;}

  .slot-card{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:8px 10px;margin-bottom:6px;}
  .slot-empty{border:1px dashed var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;
    font-size:12px;color:var(--ink-soft);}

  .slot-top{display:flex;align-items:center;gap:4px;margin-bottom:6px;}
  .slot-name{flex:1;font-size:14px;font-weight:600;}
  .icon-btn{background:none;border:none;padding:3px;cursor:pointer;color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;}
  .icon-btn.on{color:var(--teal);}
  .icon-btn.on.attitude{color:var(--red);}
  .icon-btn.on.memo{color:var(--blue);}
  .icon-btn svg{width:17px;height:17px;}

  .memo-box{font-size:11.5px;color:var(--ink-soft);background:var(--paper);
    border-radius:6px;padding:4px 8px;margin-bottom:6px;}
  .memo-box.att{color:var(--red);background:#FBEAE7;}
  .memo-box.reason{color:var(--amber);background:#FBF2DD;margin-top:6px;margin-bottom:0;}
  .reason-add{background:none;border:none;color:var(--ink-soft);font-size:11px;
    padding:4px 0 0;cursor:pointer;text-decoration:underline;}
  .memo-edit{display:flex;gap:6px;margin-bottom:6px;}
  .memo-edit input{flex:1;font-size:12.5px;border:1px solid var(--line);border-radius:8px;
    padding:6px 8px;font-family:inherit;}
  .memo-edit button{font-size:12px;border:none;background:var(--teal);color:#fff;
    border-radius:8px;padding:0 12px;}

  .status-row{display:flex;gap:5px;}
  .status-btn{flex:1;font-size:12px;font-weight:600;padding:7px 0;border-radius:8px;
    border:1px solid var(--line);background:transparent;color:var(--ink-soft);cursor:pointer;}
  .status-btn.present{border-color:var(--green);}
  .status-btn.present.active{background:#6FA05A;color:#fff;border-color:#6FA05A;}
  .status-btn.late{border-color:var(--yellow);}
  .status-btn.late.active{background:var(--amber);color:#fff;border-color:var(--amber);}
  .status-btn.absent{border-color:var(--red);}
  .status-btn.absent.active{background:var(--red);color:#fff;border-color:var(--red);}

  .edit-wrap{padding:12px 14px;}
  .edit-day{font-size:14px;font-weight:700;margin:14px 0 6px;color:var(--teal-dark);}
  .edit-day:first-child{margin-top:0;}
  .edit-block{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:8px 10px;margin-bottom:8px;}
  .edit-block .lbl{font-size:11px;color:var(--ink-soft);margin-bottom:6px;font-weight:600;}
  .edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .edit-grid input{font-size:13px;border:1px solid var(--line);border-radius:8px;
    padding:7px 8px;font-family:inherit;}

  .status-msg{text-align:center;font-size:12px;color:var(--ink-soft);padding:20px 0;}

  /* 태블릿(아이패드) 이상 넓은 화면 대응: 상단 가로 탭 + 2열 그리드 */
  @media (min-width: 900px){
    #app{max-width:1200px;}
    #topbar{padding:22px 32px;}
    #topbar h1{font-size:22px;}
    #topbar .sub{font-size:14px;}
    .header-logo{width:46px;height:44px;}
    .weekbar{padding:18px 28px;}
    .weekbar .range{font-size:19px;}
    .weekbar button{padding:11px 18px;}
    .weekbar button svg{width:26px;height:26px;}
    .toolbar{padding:18px 28px 0;}
    .toolbar button{font-size:17px;padding:14px 0;}
    .section-tab{font-size:16px;padding:16px 0;}
    .hint{font-size:14.5px;margin:0 28px 16px;}

    /* 요일 탭: 세로 사이드바 -> 상단 가로 바 */
    .body-row{display:block;}
    .daytabs{display:flex;flex-direction:row;width:auto;border-right:none;
      border-bottom:2px solid var(--line);padding:0 20px;}
    .daytab{flex:1;flex-direction:column;gap:4px;padding:14px 4px;
      border-left:none;border-bottom:3px solid transparent;}
    .daytab.active{border-left:none;border-bottom-color:var(--teal);background:transparent;}
    .daytab .d{font-size:13px;}
    .daytab.today .day-dot{margin-top:0;}
    .holiday-name{max-width:90px;font-size:10px;}

    .daypanel{padding:22px 28px 32px;}

    /* 시간블록/학생 카드: 2열 그리드로 */
    .time-label{font-size:16px;margin:20px 0 10px;}
    .time-label:first-child{margin-top:0;}
    .slot-group{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .slot-card{padding:16px 20px;margin-bottom:0;}
    .slot-empty{margin-bottom:0;padding:16px 20px;font-size:14px;}
    .slot-name{font-size:20px;}
    .icon-btn svg{width:25px;height:25px;}
    .hw-status-btn{padding:12px 14px;}
    .hw-name{font-size:18px;}
    .hw-status-label{font-size:14px;}
    .status-btn{font-size:16.5px;padding:13px 0;}
    .memo-edit input{font-size:16px;padding:11px 13px;}
    .memo-box{font-size:15px;padding:9px 13px;}
    .reason-add{font-size:14.5px;}

    .edit-wrap{padding:20px 28px;}
    .edit-day{font-size:19px;}
    .edit-block{padding:14px 16px;}
    .edit-block .lbl{font-size:14px;}
    .edit-grid{grid-template-columns:1fr 1fr 1fr 1fr;}
    .edit-grid input{font-size:16px;padding:11px 13px;}
    .status-msg{font-size:16px;}
  }
</style>
</head>

  <div id="content"><div class="status-msg">불러오는 중...</div></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzX1QnXFIXvq9sBrORDnu5fUgzobkYeCYvD-iN5mZGDTQXdxCUXO1SOpQVwv1aWRQQv/exec";
const DAYS = ["월","화","수","목","금","토"];
const BLOCKS = ["10:00","10:30","11:00","11:30","12:00","12:30","13:00","13:30","14:00","14:30","15:00","15:30","16:00","16:30","17:00","17:30","18:00","18:30","19:00","19:30","20:00"];
const SUB = 4;
const STATUS_LABEL = {present:"출석", late:"지각", absent:"결석"};

const ICONS = {
  circle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>',
  circleCheck: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>',
  note: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h14v13l-4 4H5z"/><path d="M9 9h6M9 13h4"/></svg>',
  dot: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg>',
  faceNeutral: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01M8.5 15h7"/></svg>',
  faceConcern: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01M8.5 16c1-1.3 2.2-1.3 3.5-1.3s2.5 0 3.5 1.3"/></svg>',
  chevL: '<svg viewBox="0 0 24 24" fill="none" stroke="#018875" stroke-width="2.4"><path d="M15 6l-6 6 6 6"/></svg>',
  chevR: '<svg viewBox="0 0 24 24" fill="none" stroke="#018875" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg>'
};

function pad(n){return n<10?"0"+n:""+n;}
function toDateStr(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function mondayOf(d){
  const day=d.getDay(); const diff=day===0?-6:1-day;
  const r=new Date(d); r.setDate(d.getDate()+diff); r.setHours(0,0,0,0); return r;
}
function addDays(d,n){const r=new Date(d); r.setDate(r.getDate()+n); return r;}
function fmtMD(d){return pad(d.getMonth()+1)+"/"+pad(d.getDate());}

let weekStart = mondayOf(new Date());
let roster = {};
let records = {};
let homeworkRecords = {};
let holidays = {}; // { "YYYY-MM-DD": "공휴일명" }
let editMode = false;
let activeSection = 'attendance'; // 'attendance' | 'homework'
let openAttKey = null;    // 태도 메모
let openStatusKey = null; // 지각/결석 사유 메모
let openHwMemoKey = null; // 숙제 메모
let activeDayIdx = (new Date().getDay()+6)%7;
if(activeDayIdx>5) activeDayIdx = 0;

const HW_CYCLE = {"완료":"미완료", "미완료":"미확인", "미확인":"완료"};

function emptyRoster(){
  const r={};
  DAYS.forEach(d=>{ r[d]={}; BLOCKS.forEach(b=>{ r[d][b]=["","","",""]; }); });
  return r;
}

function setSync(state){
  const el = document.getElementById('syncStatus');
  if(!el) return;
  if(state==='busy'){ el.innerHTML = '<span class="sync-dot busy"></span>저장 중'; }
  else if(state==='error'){ el.innerHTML = '<span class="sync-dot" style="background:#C0463A"></span>저장 실패, 다시 시도해주세요'; }
  else { el.innerHTML = '<span class="sync-dot"></span>동기화됨'; }
}

async function apiGet(params){
  const url = SCRIPT_URL + "?" + new URLSearchParams(params).toString();
  const res = await fetch(url);
  return res.json();
}
async function apiPost(body){
  const res = await fetch(SCRIPT_URL, {
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify(body)
  });
  return res.json();
}

async function loadRoster(){
  try{
    const rows = await apiGet({action:"roster"});
    const r = emptyRoster();
    rows.forEach(item=>{
      if(r[item.day] && r[item.day][item.block]){
        r[item.day][item.block][item.slot-1] = item.name || "";
      }
    });
    roster = r;
  }catch(e){ roster = emptyRoster(); }
}

async function loadHolidays(){
  try{
    const thisYear = new Date().getFullYear();
    const years = [thisYear, thisYear+1];
    const data = await apiGet({action:"holidays", years: years.join(",")});
    holidays = data || {};
  }catch(e){ holidays = {}; }
}

async function loadRecordsForWeek(){
  records = {};
  try{
    const rows = await apiGet({action:"records", weekStart: toDateStr(weekStart)});
    rows.forEach(rec=>{
      const slotIdx = (parseInt(rec.slot) || 1) - 1;
      const key = rec.date+"|"+rec.block+"|"+slotIdx;
      records[key] = { status: rec.status||"normal", hw: !!rec.hw, hwNote: rec.hwNote||"", attitude: !!rec.attitude,
        statusNote: rec.statusNote||"", attNote: rec.attNote||"" };
    });
  }catch(e){}
}

function getRec(dateStr, block, slot){
  const key = dateStr+"|"+block+"|"+slot;
  return records[key] || {status:"normal", hw:false, hwNote:"", attitude:false, statusNote:"", attNote:""};
}
function setRecLocal(dateStr, block, slot, rec){
  records[dateStr+"|"+block+"|"+slot] = rec;
}

async function pushRecord(dateStr, dayName, block, slot, rec){
  setSync('busy');
  try{
    await apiPost({
      action:"saveRecord",
      record:{ date:dateStr, day:dayName, block:block, slot:slot+1,
        status:rec.status, hw:rec.hw, hwNote:rec.hwNote, attitude:rec.attitude,
        statusNote:rec.statusNote, attNote:rec.attNote }
    });
    setSync('ok');
  }catch(e){ setSync('error'); }
}

async function loadHomeworkForWeek(){
  homeworkRecords = {};
  try{
    const rows = await apiGet({action:"homework", weekStart: toDateStr(weekStart)});
    rows.forEach(rec=>{
      const key = rec.date+"|"+rec.block+"|"+rec.name;
      homeworkRecords[key] = { completed: rec.completed||"미확인", memo: rec.memo||"" };
    });
  }catch(e){}
}

function getHwRec(dateStr, block, name){
  const key = dateStr+"|"+block+"|"+name;
  return homeworkRecords[key] || {completed:"미확인", memo:""};
}
function setHwRecLocal(dateStr, block, name, rec){
  homeworkRecords[dateStr+"|"+block+"|"+name] = rec;
}

async function pushHomeworkRecord(dateStr, dayName, block, name, rec){
  setSync('busy');
  try{
    await apiPost({
      action:"saveHomework",
      record:{ date:dateStr, day:dayName, block:block, name:name,
        completed:rec.completed, memo:rec.memo }
    });
    setSync('ok');
  }catch(e){ setSync('error'); }
}

async function loadWeekData(){
  await Promise.all([loadRecordsForWeek(), loadHomeworkForWeek()]);
}

async function pushRoster(){
  setSync('busy');
  const rows = [];
  DAYS.forEach(day=>{
    BLOCKS.forEach(block=>{
      roster[day][block].forEach((name, idx)=>{
        rows.push({day, block, slot: idx+1, name});
      });
    });
  });
  try{
    await apiPost({action:"saveRoster", roster: rows});
    setSync('ok');
  }catch(e){ setSync('error'); }
}

function render(){
  const content = document.getElementById('content');
  const weekEnd = addDays(weekStart,5);
  let html = "";

  html += `<div class="section-tabs">
    <button class="section-tab ${activeSection==='attendance'?'active':''}" data-section="attendance">출결</button>
    <button class="section-tab ${activeSection==='homework'?'active':''}" data-section="homework">숙제</button>
  </div>`;

  html += `<div class="weekbar">
    <button id="prevWeek" aria-label="이전 주">${ICONS.chevL}</button>
    <div class="range">${fmtMD(weekStart)} ~ ${fmtMD(weekEnd)}</div>
    <button id="nextWeek" aria-label="다음 주">${ICONS.chevR}</button>
  </div>`;

  html += `<div class="toolbar">
    <button id="toggleEdit" class="${editMode?'active':''}">${editMode? '편집 종료' : '명단 편집'}</button>
  </div>`;

  html += editMode ? renderEdit() : renderDayTabs();
  content.innerHTML = html;
  attachHandlers();
}

function renderEdit(){
  let html = `<div class="edit-wrap"><div class="hint">요일 × 시간블록별 고정 명단을 입력하세요. 빈칸은 배정 가능 자리로 표시됩니다. 편집 종료를 누르면 저장됩니다.</div>`;
  DAYS.forEach(day=>{
    html += `<div class="edit-day">${day}요일</div>`;
    BLOCKS.forEach(block=>{
      html += `<div class="edit-block"><div class="lbl">${block}</div><div class="edit-grid">`;
      for(let s=0;s<SUB;s++){
        const val = roster[day][block][s] || "";
        html += `<input type="text" data-day="${day}" data-block="${block}" data-slot="${s}" value="${val.replace(/"/g,'&quot;')}" placeholder="이름">`;
      }
      html += `</div></div>`;
    });
  });
  html += `</div>`;
  return html;
}

function renderDayTabs(){
  let html = `<div class="body-row"><div class="daytabs">`;
  const todayIdx = (new Date().getDay()+6)%7;
  DAYS.forEach((day,i)=>{
    const d = addDays(weekStart, i);
    const dateStr = toDateStr(d);
    const isToday = todayIdx===i && toDateStr(mondayOf(new Date()))===toDateStr(weekStart);
    const holidayName = holidays[dateStr];
    const isHoliday = !!holidayName;
    html += `<button class="daytab ${activeDayIdx===i?'active':''} ${isToday?'today':''} ${isHoliday?'holiday':''}" data-idx="${i}">
      <span>${day}</span><span class="d">${fmtMD(d)}</span>${isToday?'<span class="day-dot"></span>':''}${isHoliday?`<span class="holiday-name">${holidayName}</span>`:''}
    </button>`;
  });
  html += `</div><div class="daypanel">`;
  html += activeSection==='attendance'
    ? `<div class="hint">출석/지각/결석 체크 · 점=태도특이</div>` + renderDayContent(activeDayIdx)
    : `<div class="hint">이름을 탭하면 완료→미완료→미확인 순으로 바뀝니다 · 메모=숙제내용</div>` + renderHomeworkDayContent(activeDayIdx);
  html += `</div></div>`;
  return html;
}

function renderDayContent(i){
  const d = addDays(weekStart, i);
  const dateStr = toDateStr(d);
  const dayName = DAYS[i];
  let html = "";
  BLOCKS.forEach(block=>{
    const names = roster[dayName][block];
    const hasAny = names.some(n=>n && n.trim());
    if(!hasAny) return;
    html += `<div class="time-label">${block}</div><div class="slot-group">`;
    for(let s=0;s<SUB;s++){
      const name = names[s];
      if(!name || !name.trim()) continue;
      const rec = getRec(dateStr, block, s);
      const mk = dateStr+"|"+block+"|"+s;
      const attOpen = openAttKey===mk;
      const statusOpen = openStatusKey===mk;
      html += `<div class="slot-card">
        <div class="slot-top">
          <span class="slot-name">${name}</span>
          <button class="icon-btn attBtn ${rec.attitude||rec.attNote?'on attitude':''}" data-key="${mk}" aria-label="태도 특이 메모">${rec.attNote?ICONS.faceConcern:ICONS.faceNeutral}</button>
        </div>`;
      if(rec.attNote && !attOpen){
        html += `<div class="memo-box att">${rec.attNote}</div>`;
      }
      if(attOpen){
        html += `<div class="memo-edit">
          <input type="text" class="attInput" data-key="${mk}" value="${(rec.attNote||"").replace(/"/g,'&quot;')}" placeholder="예: 수업 중 산만함, 집중력 저하">
          <button class="attSave" data-key="${mk}">저장</button>
        </div>`;
      }
      html += `<div class="status-row">`;
      ["present","late","absent"].forEach(st=>{
        const active = rec.status===st;
        html += `<button class="status-btn ${st} ${active?'active':''}" data-key="${mk}" data-status="${st}">${STATUS_LABEL[st]}</button>`;
      });
      html += `</div>`;
      const needsReason = (rec.status==="late" || rec.status==="absent");
      if(needsReason && rec.statusNote && !statusOpen){
        html += `<div class="memo-box reason">사유: ${rec.statusNote}</div>`;
      }
      if(needsReason && statusOpen){
        html += `<div class="memo-edit">
          <input type="text" class="statusInput" data-key="${mk}" value="${(rec.statusNote||"").replace(/"/g,'&quot;')}" placeholder="예: 병원 방문, 가족 행사">
          <button class="statusSave" data-key="${mk}">저장</button>
        </div>`;
      }
      if(needsReason && !rec.statusNote && !statusOpen){
        html += `<button class="reason-add" data-key="${mk}">+ 사유 입력</button>`;
      }
      html += `</div>`;
    }
    html += `</div>`; // .slot-group 닫기
  });
  if(!html){
    html = `<div class="status-msg">이 요일에는 배정된 학생이 없어요.</div>`;
  }
  return html;
}

function renderHomeworkDayContent(i){
  const d = addDays(weekStart, i);
  const dateStr = toDateStr(d);
  const dayName = DAYS[i];
  let html = "";
  BLOCKS.forEach(block=>{
    const names = roster[dayName][block];
    const hasAny = names.some(n=>n && n.trim());
    if(!hasAny) return;
    html += `<div class="time-label">${block}</div><div class="slot-group">`;
    for(let s=0;s<SUB;s++){
      const name = names[s];
      if(!name || !name.trim()) continue;
      const rec = getHwRec(dateStr, block, name);
      const mk = dateStr+"|"+block+"|"+name;
      const memoOpen = openHwMemoKey===mk;
      const statusClass = rec.completed==="완료" ? "done" : rec.completed==="미완료" ? "missing" : "unchecked";
      html += `<div class="slot-card">
        <div class="slot-top">
          <button class="hw-status-btn ${statusClass}" data-key="${mk}">
            <span class="hw-name">${name}</span>
            <span class="hw-status-label">${rec.completed}</span>
          </button>
          <button class="icon-btn hwMemoBtn ${rec.memo?'on memo':''}" data-key="${mk}" aria-label="숙제 메모">${ICONS.note}</button>
        </div>`;
      if(rec.memo && !memoOpen){
        html += `<div class="memo-box">${rec.memo}</div>`;
      }
      if(memoOpen){
        html += `<div class="memo-edit">
          <input type="text" class="hwMemoInput" data-key="${mk}" value="${(rec.memo||"").replace(/"/g,'&quot;')}" placeholder="예: 워크북 32~35p, 3번 문제 재풀이">
          <button class="hwMemoSave" data-key="${mk}">저장</button>
        </div>`;
      }
      html += `</div>`;
    }
    html += `</div>`; // .slot-group 닫기
  });
  if(!html){
    html = `<div class="status-msg">이 요일에는 배정된 학생이 없어요.</div>`;
  }
  return html;
}

function parseKey(k){
  const parts = k.split("|");
  return {dateStr:parts[0], block:parts[1], slot:parseInt(parts[2])};
}
function parseHwKey(k){
  const parts = k.split("|");
  return {dateStr:parts[0], block:parts[1], name:parts.slice(2).join("|")};
}
function dayNameForDate(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  return DAYS[(d.getDay()+6)%7];
}

function refreshDayPanel(){
  const panel = document.querySelector('.daypanel');
  if(!panel) return;
  const hint = panel.querySelector('.hint').outerHTML;
  panel.innerHTML = hint + (activeSection==='attendance' ? renderDayContent(activeDayIdx) : renderHomeworkDayContent(activeDayIdx));
  if(activeSection==='attendance') attachSlotHandlers(); else attachHomeworkSlotHandlers();
}

function attachHandlers(){
  const prevBtn = document.getElementById('prevWeek');
  const nextBtn = document.getElementById('nextWeek');
  const editBtn = document.getElementById('toggleEdit');

  if(prevBtn) prevBtn.onclick = async ()=>{
    weekStart = addDays(weekStart,-7); openAttKey=null; openStatusKey=null; openHwMemoKey=null;
    render();
    await loadWeekData(); render();
  };
  if(nextBtn) nextBtn.onclick = async ()=>{
    weekStart = addDays(weekStart,7); openAttKey=null; openStatusKey=null; openHwMemoKey=null;
    render();
    await loadWeekData(); render();
  };
  if(editBtn) editBtn.onclick = async ()=>{
    if(editMode){
      document.querySelectorAll('input[data-day]').forEach(inp=>{
        roster[inp.getAttribute('data-day')][inp.getAttribute('data-block')][parseInt(inp.getAttribute('data-slot'))] = inp.value.trim();
      });
      editMode = false;
      render();
      await pushRoster();
    } else {
      editMode = true;
      render();
    }
  };

  document.querySelectorAll('.section-tab').forEach(el=>{
    el.onclick = ()=>{
      activeSection = el.getAttribute('data-section');
      openAttKey = null; openStatusKey = null; openHwMemoKey = null;
      render();
    };
  });

  document.querySelectorAll('.daytab').forEach(el=>{
    el.onclick = ()=>{
      activeDayIdx = parseInt(el.getAttribute('data-idx'));
      openAttKey = null; openStatusKey = null; openHwMemoKey = null;
      render();
    };
  });

  if(!editMode){
    if(activeSection==='attendance') attachSlotHandlers(); else attachHomeworkSlotHandlers();
  }
}

function attachSlotHandlers(){
  document.querySelectorAll('.status-btn').forEach(el=>{
    el.onclick = async ()=>{
      const {dateStr, block, slot} = parseKey(el.getAttribute('data-key'));
      const status = el.getAttribute('data-status');
      const rec = getRec(dateStr, block, slot);
      rec.status = (rec.status===status) ? "normal" : status;
      setRecLocal(dateStr, block, slot, rec);
      const key = el.getAttribute('data-key');
      if((rec.status==="late"||rec.status==="absent") && !rec.statusNote){
        openStatusKey = key;
      } else if(rec.status==="normal" || rec.status==="present"){
        openStatusKey = null;
      }
      refreshDayPanel();
      await pushRecord(dateStr, dayNameForDate(dateStr), block, slot, rec);
    };
  });
  document.querySelectorAll('.attBtn').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const key = el.getAttribute('data-key');
      openAttKey = (openAttKey===key) ? null : key;
      refreshDayPanel();
    };
  });
  document.querySelectorAll('.attSave').forEach(el=>{
    el.onclick = async (e)=>{
      e.stopPropagation();
      const key = el.getAttribute('data-key');
      const {dateStr, block, slot} = parseKey(key);
      const input = document.querySelector('.attInput[data-key="'+key+'"]');
      const rec = getRec(dateStr, block, slot);
      rec.attNote = input.value.trim();
      rec.attitude = !!rec.attNote;
      setRecLocal(dateStr, block, slot, rec);
      openAttKey = null;
      refreshDayPanel();
      await pushRecord(dateStr, dayNameForDate(dateStr), block, slot, rec);
    };
  });
  document.querySelectorAll('.reason-add').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const key = el.getAttribute('data-key');
      openStatusKey = key;
      refreshDayPanel();
    };
  });
  document.querySelectorAll('.statusSave').forEach(el=>{
    el.onclick = async (e)=>{
      e.stopPropagation();
      const key = el.getAttribute('data-key');
      const {dateStr, block, slot} = parseKey(key);
      const input = document.querySelector('.statusInput[data-key="'+key+'"]');
      const rec = getRec(dateStr, block, slot);
      rec.statusNote = input.value.trim();
      setRecLocal(dateStr, block, slot, rec);
      openStatusKey = null;
      refreshDayPanel();
      await pushRecord(dateStr, dayNameForDate(dateStr), block, slot, rec);
    };
  });
}

function attachHomeworkSlotHandlers(){
  document.querySelectorAll('.hw-status-btn').forEach(el=>{
    el.onclick = async ()=>{
      const key = el.getAttribute('data-key');
      const {dateStr, block, name} = parseHwKey(key);
      const rec = getHwRec(dateStr, block, name);
      rec.completed = HW_CYCLE[rec.completed] || "완료";
      setHwRecLocal(dateStr, block, name, rec);
      refreshDayPanel();
      await pushHomeworkRecord(dateStr, dayNameForDate(dateStr), block, name, rec);
    };
  });
  document.querySelectorAll('.hwMemoBtn').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const key = el.getAttribute('data-key');
      openHwMemoKey = (openHwMemoKey===key) ? null : key;
      refreshDayPanel();
    };
  });
  document.querySelectorAll('.hwMemoSave').forEach(el=>{
    el.onclick = async (e)=>{
      e.stopPropagation();
      const key = el.getAttribute('data-key');
      const {dateStr, block, name} = parseHwKey(key);
      const input = document.querySelector('.hwMemoInput[data-key="'+key+'"]');
      const rec = getHwRec(dateStr, block, name);
      rec.memo = input.value.trim();
      setHwRecLocal(dateStr, block, name, rec);
      openHwMemoKey = null;
      refreshDayPanel();
      await pushHomeworkRecord(dateStr, dayNameForDate(dateStr), block, name, rec);
    };
  });
}

(async function init(){
  await loadRoster();
  await loadWeekData();
  loadHolidays().then(()=>{ render(); }); // 공휴일은 백그라운드 로드 후 재렌더
  setSync('ok');
  render();
})();
</script>
</body>
</html>
