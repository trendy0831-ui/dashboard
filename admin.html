<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학생 관리 시스템 | 이끌림수학학원</title>
<link rel="apple-touch-icon" href="assets/logo-180.png">
<meta name="theme-color" content="#085041">
<style>
  :root{
    --teal:#018875;
    --teal-dark:#016A5B;
    --deep:#085041;
    --blue:#027A94;
    --green:#AACD98;
    --yellow:#F2DE97;
    --ink:#173B33;
    --ink-soft:#5C7A72;
    --paper:#F5F8F6;
    --card:#FFFFFF;
    --line:#E1EAE5;
    --amber:#B8860B;
    --red:#C0463A;
    --radius:14px;
    --sidebar-w:230px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-size:16px;}
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;}

  /* ===================== 레이아웃 셸: 사이드바 + 메인 ===================== */
  #shell{display:flex;min-height:100vh;}

  #sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--deep);color:#fff;
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
  .side-brand{display:flex;align-items:center;gap:12px;padding:22px 20px 18px;
    border-bottom:1px solid rgba(255,255,255,.12);}
  .side-brand img{width:64px;height:64px;object-fit:contain;flex-shrink:0;}
  .side-brand .names{line-height:1.35;}
  .side-brand .t1{font-size:15.5px;font-weight:800;letter-spacing:-0.2px;}
  .side-brand .t2{font-size:11.5px;color:#CFE6DE;}

  .side-nav{flex:1;padding:16px 12px;display:flex;flex-direction:column;gap:3px;}
  .nav-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;
    font-size:14.5px;font-weight:700;color:#CFE6DE;cursor:pointer;border:none;background:none;
    width:100%;text-align:left;}
  .nav-item svg{width:19px;height:19px;flex-shrink:0;opacity:.85;}
  .nav-item:hover{background:rgba(255,255,255,.07);color:#fff;}
  .nav-item.active{background:var(--yellow);color:#3B2F0B;}
  .nav-item.active svg{opacity:1;}

  .side-foot{padding:16px 20px 20px;font-size:11px;color:#9DBDB1;line-height:1.6;
    border-top:1px solid rgba(255,255,255,.12);}

  #main{flex:1;min-width:0;display:flex;flex-direction:column;}
  #mainTopbar{background:var(--card);border-bottom:1px solid var(--line);
    padding:20px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  #mainTopbar h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-0.3px;}

  .topbar-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .date-picker{display:flex;align-items:center;gap:9px;background:var(--paper);
    border:1px solid var(--line);border-radius:11px;padding:11px 16px;font-size:14.5px;font-weight:600;}
  .date-picker input[type=date]{border:none;font-family:inherit;font-size:14.5px;font-weight:600;
    color:var(--ink);background:none;}
  .edit-toggle{background:var(--card);border:1.5px solid var(--teal);color:var(--teal);
    border-radius:11px;padding:11px 20px;font-size:14.5px;font-weight:700;cursor:pointer;}
  .edit-toggle.active{background:var(--teal);color:#fff;}

  .sync-status{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-soft);
    font-weight:600;white-space:nowrap;}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:#6FA05A;flex-shrink:0;}
  .sync-dot.busy{background:var(--yellow);animation:syncPulse 1s infinite;}
  .sync-dot.error{background:var(--red);}
  @keyframes syncPulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .refresh-btn{background:var(--card);border:1px solid var(--line);border-radius:10px;
    width:38px;height:38px;display:flex;align-items:center;justify-content:center;
    color:var(--teal);cursor:pointer;flex-shrink:0;}
  .refresh-btn svg{width:17px;height:17px;}
  .refresh-btn.spinning svg{animation:refreshSpin .7s linear infinite;}
  @keyframes refreshSpin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

  #pageContent{flex:1;padding:28px 32px 48px;}

  .empty-panel{background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);
    padding:70px 20px;text-align:center;color:var(--ink-soft);font-size:15px;}
  .empty-panel .big{font-size:38px;margin-bottom:12px;}
  .empty-panel .title{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:8px;}

  /* ===================== 섹션 탭 (출결/숙제) ===================== */
  .section-tabs{display:inline-flex;background:var(--card);border:1px solid var(--line);
    border-radius:11px;padding:4px;gap:3px;margin-bottom:18px;}
  .section-tab{padding:10px 26px;text-align:center;font-size:14.5px;font-weight:700;
    color:var(--ink-soft);background:none;border:none;border-radius:8px;cursor:pointer;}
  .section-tab.active{background:var(--deep);color:#fff;}

  /* ===================== 주간 탭바 ===================== */
  .weekbar{display:flex;align-items:center;justify-content:space-between;
    background:var(--card);border:1px solid var(--line);border-radius:12px 12px 0 0;
    padding:16px 22px;}
  .weekbar button{background:var(--paper);border:1px solid var(--line);font-size:18px;color:var(--teal);
    padding:9px 14px;cursor:pointer;border-radius:9px;}
  .weekbar .range{font-size:16px;font-weight:700;}

  .daytabs{display:flex;background:var(--card);border-left:1px solid var(--line);
    border-right:1px solid var(--line);}
  .daytab{flex:1;padding:14px 8px;text-align:center;font-size:14.5px;font-weight:700;
    color:var(--ink-soft);background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;}
  .daytab .d{font-size:12px;font-weight:400;color:var(--ink-soft);}
  .daytab.active{background:var(--paper);color:var(--teal-dark);border-bottom-color:var(--teal);}
  .daytab.holiday span:not(.holiday-name),.daytab.holiday .d{color:var(--red);}
  .daytab.holiday.active{background:#FBEAE7;}
  .holiday-name{font-size:9.5px;color:var(--red);font-weight:400;line-height:1.2;text-align:center;
    max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .daypanel{background:var(--card);border:1px solid var(--line);border-top:none;
    border-radius:0 0 12px 12px;padding:24px;}
  .time-label{font-size:13.5px;color:var(--teal-dark);font-weight:800;margin:20px 0 12px;}
  .time-label:first-child{margin-top:0;}
  .slot-group{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
  .slot-card{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:14px 16px;}

  /* ===================== 아이콘/이름/메모 ===================== */
  .slot-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;gap:8px;}
  .slot-name{font-size:15.5px;font-weight:700;}
  .slot-meta{font-size:12px;color:var(--ink-soft);font-weight:600;}
  .icon-btn{background:none;border:none;padding:2px;cursor:pointer;color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;}
  .icon-btn svg{width:18px;height:18px;}
  .icon-btn.on{color:var(--red);}
  .memo-box{font-size:12px;color:var(--ink-soft);background:#fff;border-radius:7px;
    padding:6px 10px;margin-bottom:8px;}
  .memo-box.att{color:var(--red);background:#FBEAE7;}
  .memo-box.reason{color:var(--amber);background:#FBF2DD;margin-top:8px;}
  .reason-add{background:none;border:none;color:var(--ink-soft);font-size:11.5px;
    padding:5px 0 0;cursor:pointer;text-decoration:underline;}
  .memo-edit{display:flex;gap:6px;margin-bottom:8px;}
  .memo-edit input{flex:1;font-size:12.5px;border:1px solid var(--line);border-radius:8px;
    padding:6px 8px;font-family:inherit;}
  .memo-edit button{font-size:12px;border:none;background:var(--teal);color:#fff;
    border-radius:8px;padding:0 12px;cursor:pointer;}

  /* ===================== 출결 상태 버튼 ===================== */
  .status-row{display:flex;gap:6px;}
  .status-btn{flex:1;font-size:13px;font-weight:700;padding:9px 0;border-radius:9px;
    border:1px solid var(--line);background:#fff;color:var(--ink-soft);cursor:pointer;}
  .status-btn.present.active{background:#6FA05A;color:#fff;border-color:#6FA05A;}
  .status-btn.late.active{background:var(--amber);color:#fff;border-color:var(--amber);}
  .status-btn.absent.active{background:var(--red);color:#fff;border-color:var(--red);}
  .empty-hint{color:var(--ink-soft);font-size:14.5px;text-align:center;padding:40px 0;}

  /* ===================== 보강 토글 ===================== */
  .makeup-toggle{display:block;width:100%;margin-top:8px;padding:8px 10px;font-size:12px;
    font-weight:700;border-radius:8px;border:1px dashed var(--amber);background:#FBF2DD;
    color:var(--amber);cursor:pointer;text-align:center;}
  .makeup-toggle.done{border-style:solid;border-color:#6FA05A;background:#EAF3E5;color:#3D6B2E;}

  /* ===================== 등원/하원 시간 ===================== */
  .time-row{display:flex;gap:8px;margin-top:10px;}
  .time-field{flex:1;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);
    border-radius:8px;padding:7px 10px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;}
  .time-field svg{width:13px;height:13px;flex-shrink:0;opacity:.7;}
  .time-field .tf-label{font-weight:600;white-space:nowrap;}
  .time-field .tf-val{flex:1;text-align:right;font-weight:700;color:var(--ink);}
  .time-field .tf-val.empty{color:var(--ink-soft);font-weight:400;}
  .time-field.editing{padding:5px 7px;}
  .time-field input[type=time]{border:none;background:none;font-family:inherit;font-size:12.5px;
    font-weight:700;color:var(--ink);width:100%;text-align:right;}
  .time-field.checkout-btn{justify-content:center;color:var(--blue);
    border-color:var(--blue);font-weight:700;}
  .time-field.checkout-btn:hover{background:#EAF5F7;}

  /* ===================== 숙제 카드 ===================== */
  .hw-status-btn{width:100%;display:flex;align-items:flex-start;justify-content:space-between;
    background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px 13px;
    cursor:pointer;text-align:left;margin-bottom:8px;}
  .hw-name{font-size:15px;font-weight:700;color:var(--ink);}
  .hw-status-label{font-size:12.5px;font-weight:700;color:var(--ink-soft);}
  .hw-status-btn.done{background:var(--teal);border-color:var(--teal);}
  .hw-status-btn.done .hw-name,.hw-status-btn.done .hw-status-label{color:#fff;}
  .hw-status-btn.missing{border:2px solid var(--amber);}
  .hw-status-btn.missing .hw-status-label{color:var(--amber);}
  .hw-status-btn.unchecked{border-style:dashed;}

  /* ===================== 명단 편집 ===================== */
  #editView{display:none;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:26px;}
  .edit-hint{font-size:13.5px;color:var(--ink-soft);margin-bottom:18px;line-height:1.6;}
  .edit-day{font-size:16px;font-weight:800;margin:20px 0 10px;color:var(--teal-dark);}
  .edit-day:first-child{margin-top:0;}
  .edit-block{background:var(--paper);border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;margin-bottom:8px;}
  .edit-block .lbl{font-size:12px;color:var(--ink-soft);margin-bottom:8px;font-weight:700;}
  .edit-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .edit-grid input{font-size:13.5px;border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;font-family:inherit;}

  /* ===================== 하단: 미체크 + 학생별 이력 ===================== */
  .bottom-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px;}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;}
  .panel h2{font-size:16px;font-weight:800;margin:0 0 16px;display:flex;align-items:center;
    justify-content:space-between;}
  .panel h2 .sub{font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  .panel h2 .badge-count{font-size:12px;font-weight:800;padding:3px 10px;border-radius:20px;
    background:var(--red);color:#fff;}

  /* ===================== 대시보드 ===================== */
  .dash-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
  @media (max-width: 900px){ .dash-summary{grid-template-columns:repeat(2,1fr);} }
  .dash-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px 22px;}
  .dash-card .dc-label{font-size:13px;color:var(--ink-soft);font-weight:700;margin-bottom:8px;}
  .dash-card .dc-value{font-size:30px;font-weight:800;color:var(--ink);line-height:1.2;}
  .dash-card .dc-value .unit{font-size:15px;font-weight:700;color:var(--ink-soft);margin-left:2px;}
  .dash-card.accent-red .dc-value{color:var(--red);}
  .dash-card.accent-teal .dc-value{color:var(--teal-dark);}
  .dash-card.accent-blue .dc-value{color:var(--blue);}

  .reason-feed{display:flex;flex-direction:column;gap:10px;}
  .reason-item{display:flex;align-items:flex-start;gap:14px;background:var(--paper);
    border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
  .reason-item .ri-badge{flex-shrink:0;font-size:12px;font-weight:800;padding:5px 11px;
    border-radius:7px;color:#fff;white-space:nowrap;}
  .reason-item .ri-badge.late{background:var(--amber);}
  .reason-item .ri-badge.absent{background:var(--red);}
  .reason-item .ri-body{flex:1;min-width:0;}
  .reason-item .ri-top{display:flex;align-items:baseline;gap:8px;margin-bottom:3px;flex-wrap:wrap;}
  .reason-item .ri-name{font-size:14.5px;font-weight:700;}
  .reason-item .ri-meta{font-size:12px;color:var(--ink-soft);}
  .reason-item .ri-date{font-size:12px;color:var(--ink-soft);margin-left:auto;white-space:nowrap;}
  .reason-item .ri-text{font-size:13.5px;color:var(--ink);}
  .reason-feed-empty{color:var(--ink-soft);font-size:14px;text-align:center;padding:40px 0;}

  .unchecked-list{display:flex;flex-direction:column;gap:8px;max-height:400px;overflow-y:auto;}
  .unchecked-item{display:flex;align-items:center;justify-content:space-between;
    background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:10px 14px;}
  .unchecked-item .uc-name{font-size:14.5px;font-weight:700;}
  .unchecked-item .uc-block{font-size:12.5px;color:var(--ink-soft);}
  .unchecked-empty{color:var(--ink-soft);font-size:14px;text-align:center;padding:30px 0;}

  .stu-select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;
    font-size:14px;font-family:inherit;color:var(--ink);margin-bottom:16px;background:var(--paper);}

  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-head button{border:none;background:var(--paper);border-radius:8px;width:32px;height:32px;
    color:var(--teal);cursor:pointer;font-size:15px;}
  .cal-head .lbl{font-size:14.5px;font-weight:700;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;}
  .cal-dow{font-size:11.5px;color:var(--ink-soft);font-weight:700;padding-bottom:5px;}
  .cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    border-radius:9px;font-size:13px;position:relative;}
  .cal-cell.pad{visibility:hidden;}
  .cal-cell .dnum{font-size:12.5px;}
  .cal-cell .mark{width:6px;height:6px;border-radius:50%;margin-top:2px;}
  .cal-cell.present{background:#EAF3E5;}
  .cal-cell.present .mark{background:#6FA05A;}
  .cal-cell.late{background:#FBF2DD;}
  .cal-cell.late .mark{background:var(--amber);}
  .cal-cell.absent{background:#FBEAE7;}
  .cal-cell.absent .mark{background:var(--red);}

  /* ===================== 반응형: 아이패드 세로 / 좁은 화면 ===================== */
  @media (max-width: 1000px){
    .bottom-grid{grid-template-columns:1fr;}
  }
  @media (max-width: 860px){
    :root{--sidebar-w:100%;font-size:15px;}
    #shell{flex-direction:column;}
    #sidebar{position:relative;height:auto;flex-direction:row;align-items:center;
      overflow-x:auto;padding:0;}
    .side-brand{border-bottom:none;border-right:1px solid rgba(255,255,255,.12);flex-shrink:0;padding:14px 16px;}
    .side-brand img{width:46px;height:46px;}
    .side-nav{flex-direction:row;padding:8px;flex:1;}
    .nav-item{white-space:nowrap;padding:9px 12px;font-size:13px;}
    .side-foot{display:none;}
    #mainTopbar{padding:16px 18px;}
    #mainTopbar h1{font-size:18px;}
    #pageContent{padding:18px;}
    .slot-group{grid-template-columns:1fr;}
    .edit-grid{grid-template-columns:repeat(2,1fr);}
  }

  /* ===================== 핸드폰 폭 ===================== */
  @media (max-width: 480px){
    :root{font-size:14px;}
    .side-brand{padding:10px 12px;}
    .side-brand .t1{font-size:13.5px;}
    .side-brand .t2{font-size:10px;}
    .nav-item{font-size:12px;padding:8px 10px;gap:6px;}
    .nav-item svg{width:15px;height:15px;}
    #mainTopbar{padding:12px 14px;gap:10px;}
    #mainTopbar h1{font-size:16px;}
    .topbar-actions{width:100%;gap:8px;}
    .date-picker{flex:1;padding:9px 12px;font-size:13px;}
    .sync-status{font-size:11px;order:1;}
    .refresh-btn{width:32px;height:32px;order:2;}
    .refresh-btn svg{width:14px;height:14px;}
    .date-picker input[type=date]{font-size:13px;width:100%;}
    .edit-toggle{padding:9px 14px;font-size:13px;white-space:nowrap;}
    #pageContent{padding:14px;}
    .section-tabs{width:100%;}
    .section-tab{flex:1;padding:9px 0;font-size:13px;}
    .weekbar{padding:12px 14px;}
    .weekbar .range{font-size:14px;}
    .weekbar button{padding:6px 10px;font-size:15px;}
    .daytabs{overflow-x:auto;}
    .daytab{padding:10px 4px;font-size:12.5px;min-width:44px;}
    .daytab .d{font-size:10px;}
    .holiday-name{font-size:8px;max-width:50px;}
    .daypanel{padding:14px;}
    .time-label{font-size:12px;margin:14px 0 8px;}
    .slot-card{padding:11px 12px;}
    .slot-name{font-size:14px;}
    .slot-meta{font-size:10.5px;}
    .status-btn{font-size:11.5px;padding:8px 0;}
    .time-field{font-size:11px;padding:6px 8px;}
    .time-field .tf-label{font-size:11px;}
    .hw-name{font-size:13.5px;}
    .hw-status-label{font-size:11px;}
    .bottom-grid{gap:14px;margin-top:18px;}
    .dash-summary{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
    .dash-card{padding:14px 16px;}
    .dash-card .dc-label{font-size:11.5px;}
    .dash-card .dc-value{font-size:22px;}
    .reason-item{padding:11px 12px;gap:10px;}
    .reason-item .ri-name{font-size:13px;}
    .reason-item .ri-text{font-size:12.5px;}
    .panel{padding:16px 16px;}
    .panel h2{font-size:14px;}
    .edit-grid{grid-template-columns:1fr 1fr;}
    .edit-grid input{font-size:13px;padding:7px 8px;}
    .cal-grid{gap:3px;}
    .cal-cell{font-size:11px;}
  }
  /* ===================== 저장 실패 알림 토스트 ===================== */
  #saveToast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--red);color:#fff;padding:13px 22px;border-radius:11px;font-size:14px;font-weight:700;
    box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:999;opacity:0;pointer-events:none;
    transition:opacity .2s, transform .2s;display:flex;align-items:center;gap:10px;}
  #saveToast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #saveToast svg{width:18px;height:18px;flex-shrink:0;}
</style>
</head>
<body>
<div id="saveToast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span id="saveToastText">저장에 실패했어요. 인터넷 연결을 확인해주세요.</span></div>
<div id="shell">
  <div id="sidebar">
    <div class="side-brand">
      <img src="assets/logo-rounded.png" alt="이끌림수학학원 로고">
      <div class="names">
        <div class="t1">이끌림수학학원</div>

<script>

/* ============ 기존 attendance.html과 동일한 데이터/동기화 레이어 ============ */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzSVS9mzGr116jePeDPKV1lesU4hI7wIm_11yjYaYruLS38kWj32-E_QHEny3K8l00E/exec";
const DAYS = ["월","화","수","목","금","토"];
const BLOCKS = ["10:00","10:30","11:00","11:30","12:00","12:30","13:00","13:30","14:00","14:30","15:00","15:30","16:00","16:30","17:00","17:30","18:00","18:30","19:00","19:30","20:00"];
const SUB = 4;
const STATUS_LABEL = {present:"출석", late:"지각", absent:"결석"};

function pad(n){return n<10?"0"+n:""+n;}
function toDateStr(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function mondayOf(d){ const day=d.getDay(); const diff=day===0?-6:1-day; const r=new Date(d); r.setDate(d.getDate()+diff); r.setHours(0,0,0,0); return r; }
function addDays(d,n){const r=new Date(d); r.setDate(r.getDate()+n); return r;}
function fmtMD(d){return pad(d.getMonth()+1)+"/"+pad(d.getDate());}

let weekStart = mondayOf(new Date());
let selectedDate = new Date();
let roster = {};
let records = {};       // 이번 주 기록 (카드/테이블 뷰용)
let homeworkRecords = {}; // 이번 주 숙제 기록
let monthRecords = {};  // 학생별 캘린더용 (월 단위)
let activeDayIdx = (new Date().getDay()+6)%7;
if(activeDayIdx>5) activeDayIdx = 0;
let openTimeKey = null; // "date|block|slot|in" or "...|out" — 현재 편집중인 시간 필드
let calMonth = new Date(); calMonth.setDate(1);
let selectedStudent = '';
let activeSection = 'attendance'; // 'attendance' | 'homework'
let editMode = false;
let openAttKey = null;    // 태도 메모 편집중인 카드 키
let openStatusKey = null; // 지각/결석 사유 메모 편집중인 카드 키
let openHwMemoKey = null; // 숙제 메모 편집중인 카드 키
let holidays = {}; // { "YYYY-MM-DD": "공휴일명" }
const HW_CYCLE = {"완료":"미완료", "미완료":"미확인", "미확인":"완료"};

function emptyRoster(){
  const r={};
  DAYS.forEach(d=>{ r[d]={}; BLOCKS.forEach(b=>{ r[d][b]=["","","",""]; }); });
  return r;
}

async function apiGetOnce(params){
  const url = SCRIPT_URL + "?" + new URLSearchParams({...params, _t: Date.now()}).toString();
  const res = await fetch(url, { cache: "no-store" });
  if(!res.ok) throw new Error("HTTP "+res.status);
  return res.json();
}
async function apiGet(params){
  // Apps Script의 리다이렉트 응답(echo)이 간헐적으로 404를 내는 경우가 있어
  // 실패 시 짧게 기다렸다가 최대 2번 더 시도한다.
  let lastErr;
  for(let attempt=0; attempt<3; attempt++){
    try{
      return await apiGetOnce(params);
    }catch(e){
      lastErr = e;
      if(attempt<2) await new Promise(r=>setTimeout(r, 800));
    }
  }
  throw lastErr;
}
async function apiPost(body){
  // Apps Script exec 엔드포인트는 CORS 헤더를 내려주지 않아 일반 fetch로는
  // 브라우저가 응답을 차단한다(요청 자체는 서버에 도달·처리됨). 따라서 no-cors로
  // 보내고, 저장 완료 여부는 pushRecord 쪽에서 시간을 두고 보정한다.
  await fetch(SCRIPT_URL, {
    method:"POST",
    mode:"no-cors",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify(body)
  });
  return {status:"ok"};
}

let saveToastTimer = null;
function showSaveFailToast(msg){
  const el = document.getElementById('saveToast');
  if(!el) return;
  document.getElementById('saveToastText').textContent = msg || '저장에 실패했어요. 인터넷 연결을 확인해주세요.';
  el.classList.add('show');
  if(saveToastTimer) clearTimeout(saveToastTimer);
  saveToastTimer = setTimeout(()=> el.classList.remove('show'), 4000);
}

async function loadRoster(){
  try{
    const rows = await apiGet({action:"roster"});
    const r = emptyRoster();
    rows.forEach(item=>{ if(r[item.day] && r[item.day][item.block]) r[item.day][item.block][item.slot-1] = item.name || ""; });
    roster = r; // 성공했을 때만 교체 — 실패 시 기존 roster를 그대로 유지해 화면이 비지 않게 한다
  }catch(e){
    if(!roster || !Object.keys(roster).length) roster = emptyRoster(); // 최초 로드 실패 시에만 빈 값으로 초기화
    showSaveFailToast('명단을 불러오지 못했어요. 새로고침해서 다시 시도해주세요.');
  }
}

async function loadRecordsForWeek(){
  try{
    const rows = await apiGet({action:"records", weekStart: toDateStr(weekStart)});
    const next = {};
    rows.forEach(rec=>{
      const slotIdx = (parseInt(rec.slot) || 1) - 1;
      const key = rec.date+"|"+rec.block+"|"+slotIdx;
      next[key] = { status: rec.status||"normal", statusNote: rec.statusNote||"", attNote: rec.attNote||"",
        checkIn: rec.checkIn||"", checkOut: rec.checkOut||"",
        makeupDone: !!rec.makeupDone, makeupDate: rec.makeupDate||"" };
    });
    records = next; // 성공했을 때만 교체 — 실패 시 기존 records(방금 클릭한 로컬 반영 포함)를 그대로 둔다
  }catch(e){
    showSaveFailToast('출결 기록을 불러오지 못했어요. 새로고침해서 다시 시도해주세요.');
  }
}

function getRec(dateStr, block, slot){
  const key = dateStr+"|"+block+"|"+slot;
  return records[key] || {status:"normal", statusNote:"", attNote:"", checkIn:"", checkOut:"", makeupDone:false, makeupDate:""};
}
function setRecLocal(dateStr, block, slot, rec){ records[dateStr+"|"+block+"|"+slot] = rec; }

async function pushRecord(dateStr, dayName, block, slot, rec){
  const body = { action:"saveRecord", record:{ date:dateStr, day:dayName, block:block, slot:slot+1,
    status:rec.status, hw:false, hwNote:"", attitude:!!rec.attNote,
    statusNote:rec.statusNote||"", attNote:rec.attNote||"",
    checkIn:rec.checkIn||"", checkOut:rec.checkOut||"",
    makeupDone: !!rec.makeupDone, makeupDate: rec.makeupDate||"" } };
  pendingSaveCount++;
  try{
    try{
      await apiPost(body);
    }catch(e){
      try{ await apiPost(body); } // 일시적 네트워크 문제일 수 있어 한 번 더 시도
      catch(e2){ showSaveFailToast('출결 저장에 실패했어요. 인터넷 연결을 확인하고 다시 체크해주세요.'); }
    }
    // no-cors라 저장 완료 여부를 알 수 없으므로, 시트 반영이 끝날 만한 시간만큼
    // 자동 새로고침이 결과를 덮어쓰지 않도록 인위적으로 대기한다.
    await new Promise(r=>setTimeout(r, 3000));
  }finally{
    pendingSaveCount--;
  }
}

async function loadHomeworkForWeek(){
  try{
    const rows = await apiGet({action:"homework", weekStart: toDateStr(weekStart)});
    const next = {};
    rows.forEach(rec=>{
      const key = rec.date+"|"+rec.block+"|"+rec.name;
      next[key] = { completed: rec.completed||"미확인", memo: rec.memo||"" };
    });
    homeworkRecords = next; // 성공했을 때만 교체
  }catch(e){}
}
function getHwRec(dateStr, block, name){
  const key = dateStr+"|"+block+"|"+name;
  return homeworkRecords[key] || {completed:"미확인", memo:""};
}
function setHwRecLocal(dateStr, block, name, rec){ homeworkRecords[dateStr+"|"+block+"|"+name] = rec; }
async function pushHomeworkRecord(dateStr, dayName, block, name, rec){
  const body = { action:"saveHomework", record:{ date:dateStr, day:dayName, block:block, name:name,
    completed:rec.completed, memo:rec.memo } };
  pendingSaveCount++;
  try{
    try{
      await apiPost(body);
    }catch(e){
      try{ await apiPost(body); }
      catch(e2){ showSaveFailToast('숙제 저장에 실패했어요. 인터넷 연결을 확인하고 다시 체크해주세요.'); }
    }
    await new Promise(r=>setTimeout(r, 3000));
  }finally{
    pendingSaveCount--;
  }
}

async function loadWeekData(){
  await Promise.all([loadRecordsForWeek(), loadHomeworkForWeek()]);
}

async function loadHolidays(){
  try{
    const thisYear = new Date().getFullYear();
    const years = [thisYear, thisYear+1];
    const data = await apiGet({action:"holidays", years: years.join(",")});
    holidays = data || {};
  }catch(e){ holidays = {}; }
}

/* ============ 동기화 상태 / 자동·수동 새로고침 ============ */
let lastSyncAt = null;
let autoRefreshTimer = null;
const AUTO_REFRESH_INTERVAL = 30000; // 30초

function setSyncStatus(state){
  const dot = document.getElementById('syncDot');
  const text = document.getElementById('syncStatusText');
  if(!dot || !text) return;
  dot.classList.remove('busy','error');
  if(state === 'busy'){
    dot.classList.add('busy');
    text.textContent = '동기화 중';
  } else if(state === 'error'){
    dot.classList.add('error');
    text.textContent = '동기화 실패';
  } else {
    lastSyncAt = new Date();
    text.textContent = '방금 업데이트됨';
  }
}

function syncStatusTick(){
  const text = document.getElementById('syncStatusText');
  const dot = document.getElementById('syncDot');
  if(!text || !lastSyncAt || (dot && (dot.classList.contains('busy')||dot.classList.contains('error')))) return;
  const secs = Math.floor((Date.now() - lastSyncAt.getTime())/1000);
  if(secs < 5) text.textContent = '방금 업데이트됨';
  else if(secs < 60) text.textContent = secs+'초 전 업데이트';
  else text.textContent = Math.floor(secs/60)+'분 전 업데이트';
}
setInterval(syncStatusTick, 5000);

// 지금 무언가 입력/편집 중인지 — 이때는 자동 새로고침으로 화면을 덮어쓰지 않는다
let pendingSaveCount = 0; // 진행 중인 저장(POST) 요청 수 — 0보다 크면 자동 새로고침이 결과를 덮어쓸 수 있어 건너뜀
function isUserEditing(){
  return editMode || !!openTimeKey || !!openAttKey || !!openStatusKey || !!openHwMemoKey || pendingSaveCount > 0;
}

async function refreshData(auto){
  if(auto && isUserEditing()) return; // 편집 중이면 자동 새로고침은 건너뜀
  // 저장이 진행 중이면 그 저장이 끝날 때까지 잠깐 기다렸다가 새로고침 (최대 3초)
  let waited = 0;
  while(pendingSaveCount > 0 && waited < 3000){
    await new Promise(r=>setTimeout(r, 150));
    waited += 150;
  }
  setSyncStatus('busy');
  const btn = document.getElementById('refreshBtn');
  if(btn) btn.classList.add('spinning');
  try{
    await loadRoster();
    await loadWeekData();
    if(!editMode){
      renderCardView();
      populateStudentSelect();
      if(selectedStudent) { await loadMonthRecords(); renderCalendar(); }
      if(currentPage === 'dashboard') renderDashboard();
    }
    setSyncStatus('ok');
  }catch(e){
    setSyncStatus('error');
  }finally{
    if(btn) btn.classList.remove('spinning');
  }
}

document.getElementById('refreshBtn').onclick = ()=> refreshData(false);

function startAutoRefresh(){
  if(autoRefreshTimer) clearInterval(autoRefreshTimer);
  autoRefreshTimer = setInterval(()=> refreshData(true), AUTO_REFRESH_INTERVAL);
}
// 화면이 다시 보일 때(예: 탭을 잠깐 나갔다 돌아왔을 때)도 한 번 갱신
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible') refreshData(true);
});

async function pushRoster(){
  const rows = [];
  DAYS.forEach(day=>{ BLOCKS.forEach(block=>{ roster[day][block].forEach((name, idx)=>{ rows.push({day, block, slot: idx+1, name}); }); }); });
  const body = {action:"saveRoster", roster: rows};
  pendingSaveCount++;
  try{
    try{
      await apiPost(body);
    }catch(e){
      try{ await apiPost(body); }
      catch(e2){ showSaveFailToast('명단 저장에 실패했어요. 인터넷 연결을 확인하고 다시 시도해주세요.'); }
    }
  }finally{
    pendingSaveCount--;
  }
}

function dayNameForDate(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  return DAYS[(d.getDay()+6)%7];
}

/* ============ 학생 목록 (roster 전체에서 고유 이름 추출) ============ */
function allStudentNames(){
  const set = new Set();
  DAYS.forEach(day=>{ BLOCKS.forEach(block=>{ roster[day][block].forEach(n=>{ if(n && n.trim()) set.add(n.trim()); }); }); });
  return Array.from(set).sort((a,b)=>a.localeCompare(b,'ko'));
}

// roster에는 "이름/학교/학년" 형식의 원본 문자열이 그대로 저장됨(예: 김휘은/동부고/중1).
// 표시할 때만 이 함수로 분해해서 쓴다 — 저장 키(name)는 항상 원본 문자열을 그대로 사용.
function parseStudentEntry(raw){
  const parts = (raw||"").split("/").map(s=>s.trim());
  return { name: parts[0]||"", school: parts[1]||"", grade: parts[2]||"" };
}

/* ============ 날짜 선택 ============ */
const datePick = document.getElementById('datePick');
datePick.value = toDateStr(selectedDate);
datePick.onchange = async ()=>{
  selectedDate = new Date(datePick.value+"T00:00:00");
  weekStart = mondayOf(selectedDate);
  activeDayIdx = (selectedDate.getDay()+6)%7;
  if(activeDayIdx>5) activeDayIdx = 0;
  openTimeKey = null; openAttKey = null; openStatusKey = null; openHwMemoKey = null;
  await loadWeekData();
  renderAll();
};

document.getElementById('prevWeek').onclick = async ()=>{
  weekStart = addDays(weekStart, -7);
  openTimeKey = null; openAttKey = null; openStatusKey = null; openHwMemoKey = null;
  renderCardView();
  await loadWeekData();
  renderCardView();
};
document.getElementById('nextWeek').onclick = async ()=>{
  weekStart = addDays(weekStart, 7);
  openTimeKey = null; openAttKey = null; openStatusKey = null; openHwMemoKey = null;
  renderCardView();
  await loadWeekData();
  renderCardView();
};

/* ============ 카드형 렌더링 ============ */
function renderCardView(){
  const weekEnd = addDays(weekStart,5);
  document.getElementById('weekRange').textContent = fmtMD(weekStart)+" ~ "+fmtMD(weekEnd);

  const tabsEl = document.getElementById('dayTabs');
  let th = "";
  DAYS.forEach((day,i)=>{
    const d = addDays(weekStart, i);
    const dateStr = toDateStr(d);
    const holidayName = holidays[dateStr];
    const isHoliday = !!holidayName;
    th += `<button class="daytab ${activeDayIdx===i?'active':''} ${isHoliday?'holiday':''}" data-idx="${i}"><span>${day}</span><span class="d">${fmtMD(d)}</span>${isHoliday?`<span class="holiday-name">${holidayName}</span>`:''}</button>`;
  });
  tabsEl.innerHTML = th;
  tabsEl.querySelectorAll('.daytab').forEach(el=>{
    el.onclick = ()=>{
      activeDayIdx = parseInt(el.getAttribute('data-idx'));
      selectedDate = addDays(weekStart, activeDayIdx);
      datePick.value = toDateStr(selectedDate);
      openTimeKey = null; openAttKey = null; openStatusKey = null; openHwMemoKey = null;
      renderCardView();
    };
  });

  document.getElementById('bottomGrid').style.display = activeSection==='attendance' ? '' : 'none';

  const panel = document.getElementById('dayPanel');
  panel.innerHTML = activeSection==='attendance' ? renderAttendanceDayContent() : renderHomeworkDayContent();
  attachCardHandlers();
  if(activeSection==='attendance') renderUnchecked();
}

function renderAttendanceDayContent(){
  const d = addDays(weekStart, activeDayIdx);
  const dateStr = toDateStr(d);
  const dayName = DAYS[activeDayIdx];
  let html = "";
  BLOCKS.forEach(block=>{
    const names = roster[dayName][block];
    const hasAny = names.some(n=>n && n.trim());
    if(!hasAny) return;
    html += `<div class="time-label">${block}</div><div class="slot-group">`;
    for(let s=0;s<SUB;s++){
      const name = names[s];
      if(!name || !name.trim()) continue;
      const stu = parseStudentEntry(name);
      const meta = [stu.school, stu.grade].filter(Boolean).join(' · ');
      const rec = getRec(dateStr, block, s);
      const mk = dateStr+"|"+block+"|"+s;
      const attOpen = openAttKey===mk;
      const statusOpen = openStatusKey===mk;
      const faceIcon = rec.attNote
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01M8.5 16c1-1.3 2.2-1.3 3.5-1.3s2.5 0 3.5 1.3"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01M8.5 15h7"/></svg>';
      html += `<div class="slot-card">
        <div class="slot-top">
          <span><span class="slot-name">${stu.name}</span>${meta?` <span class="slot-meta">${meta}</span>`:''}</span>
          <button class="icon-btn attBtn ${rec.attNote?'on':''}" data-key="${mk}" aria-label="태도 메모">${faceIcon}</button>
        </div>`;
      if(rec.attNote && !attOpen) html += `<div class="memo-box att">${rec.attNote}</div>`;
      if(attOpen){
        html += `<div class="memo-edit">
          <input type="text" class="attInput" data-key="${mk}" value="${(rec.attNote||"").replace(/"/g,'&quot;')}" placeholder="예: 수업 중 산만함">
          <button class="attSave" data-key="${mk}">저장</button>
        </div>`;
      }
      html += `<div class="status-row">`;
      ["present","late","absent"].forEach(st=>{
        html += `<button class="status-btn ${st} ${rec.status===st?'active':''}" data-key="${mk}" data-status="${st}">${STATUS_LABEL[st]}</button>`;
      });
      html += `</div>`;
      const needsReason = (rec.status==="late" || rec.status==="absent");
      if(needsReason && rec.statusNote && !statusOpen) html += `<div class="memo-box reason">사유: ${rec.statusNote}</div>`;
      if(needsReason && statusOpen){
        html += `<div class="memo-edit">
          <input type="text" class="statusInput" data-key="${mk}" value="${(rec.statusNote||"").replace(/"/g,'&quot;')}" placeholder="예: 병원 방문">
          <button class="statusSave" data-key="${mk}">저장</button>
        </div>`;
      }
      if(needsReason && !rec.statusNote && !statusOpen) html += `<button class="reason-add" data-key="${mk}">+ 사유 입력</button>`;

      // 보강 토글 — 결석일 때만 표시
      if(rec.status === 'absent'){
        html += `<button class="makeup-toggle ${rec.makeupDone?'done':''}" data-key="${mk}">
          ${rec.makeupDone ? `✓ 보강 완료${rec.makeupDate?` (${rec.makeupDate})`:''}` : '보강 대기 중 — 완료로 표시'}
        </button>`;
      }

      html += renderTimeRow(mk, rec);
      html += `</div>`;
    }
    html += `</div>`;
  });
  if(!html) html = `<div class="empty-hint">이 요일에는 배정된 학생이 없어요.</div>`;
  return html;
}

function renderTimeRow(mk, rec){
  const inEditing = openTimeKey === mk+"|in";
  const outEditing = openTimeKey === mk+"|out";
  const inVal = rec.checkIn || "";
  const outVal = rec.checkOut || "";
  const clockIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';

  const inField = `<div class="time-field ${inEditing?'editing':''}" data-key="${mk}" data-kind="in">
    ${inEditing
      ? `<input type="time" class="time-input" data-key="${mk}" data-kind="in" value="${inVal}">`
      : `${clockIcon}<span class="tf-label">등원</span><span class="tf-val ${inVal?'':'empty'}">${inVal||'--:--'}</span>`}
  </div>`;

  let outField;
  if(!outVal && !outEditing){
    // 하원 전: 버튼으로 표시, 누르면 현재 시각 자동 기록
    outField = `<button class="time-field checkout-btn" data-key="${mk}">${clockIcon}<span class="tf-label">하원 체크</span></button>`;
  } else {
    outField = `<div class="time-field ${outEditing?'editing':''}" data-key="${mk}" data-kind="out">
      ${outEditing
        ? `<input type="time" class="time-input" data-key="${mk}" data-kind="out" value="${outVal}">`
        : `${clockIcon}<span class="tf-label">하원</span><span class="tf-val">${outVal}</span>`}
    </div>`;
  }

  return `<div class="time-row">${inField}${outField}</div>`;
}

function nowHHMM(){
  const d = new Date();
  return pad(d.getHours())+":"+pad(d.getMinutes());
}

function attachCardHandlers(){
  document.querySelectorAll('#dayPanel .status-btn').forEach(el=>{
    el.onclick = async ()=>{
      const [dateStr, block, slotStr] = el.getAttribute('data-key').split("|");
      const slot = parseInt(slotStr);
      const status = el.getAttribute('data-status');
      const rec = getRec(dateStr, block, slot);
      const turningOn = rec.status !== status;
      rec.status = turningOn ? status : "normal";
      // 출석/지각으로 처음 표시할 때, 등원 시간이 비어있으면 현재 시각으로 자동 기록
      if(turningOn && (status==='present' || status==='late') && !rec.checkIn){
        rec.checkIn = nowHHMM();
      }
      setRecLocal(dateStr, block, slot, rec);
      renderCardView();
      await pushRecord(dateStr, dayNameForDate(dateStr), block, slot, rec);
    };
  });

  document.querySelectorAll('#dayPanel .checkout-btn').forEach(el=>{
    el.onclick = async ()=>{
      const [dateStr, block, slotStr] = el.getAttribute('data-key').split("|");
      const slot = parseInt(slotStr);
      const rec = getRec(dateStr, block, slot);
      if(!rec.checkOut) rec.checkOut = nowHHMM();
      setRecLocal(dateStr, block, slot, rec);
      renderCardView();
      await pushRecord(dateStr, dayNameForDate(dateStr), block, slot, rec);
    };
  });

  document.querySelectorAll('#dayPanel .time-field:not(.checkout-btn)').forEach(el=>{
    el.onclick = (e)=>{
      if(e.target.closest('.time-input')) return; // 이미 편집중인 input 클릭은 무시

      const kind = el.getAttribute('data-kind');
      openTimeKey = mk+"|"+kind;

      if(input) input.focus();
    };
  });

  document.querySelectorAll('#dayPanel .time-input').forEach(el=>{

      const mk = el.getAttribute('data-key');
      const kind = el.getAttribute('data-kind');
      const [dateStr, block, slotStr] = mk.split("|");
      const slot = parseInt(slotStr);
      const rec = getRec(dateStr, block, slot);
      if(kind==='in') rec.checkIn = el.value; else rec.checkOut = el.value;
      setRecLocal(dateStr, block, slot, rec);
      openTimeKey = null;
      renderCardView();
      await pushRecord(dateStr, dayNameForDate(dateStr), block, slot, rec);
    };
    el.onblur = commit;
    el.onkeydown = (e)=>{ if(e.key==='Enter') el.blur(); };

  // 태도 메모 열기/닫기
  document.querySelectorAll('#dayPanel .attBtn').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      const key = el.getAttribute('data-key');
      openAttKey = (openAttKey===key) ? null : key;
      renderCardView();
    };
  });
  document.querySelectorAll('#dayPanel .attSave').forEach(el=>{
    el.onclick = async (e)=>{
      e.stopPropagation();
      const key = el.getAttribute('data-key');
      const [dateStr, block, slotStr] = key.split("|");
      const slot = parseInt(slotStr);
      const input = document.querySelector(`.attInput[data-key="${key}"]`);
      const rec = getRec(dateStr, block, slot);
      rec.attNote = input.value.trim();
      setRecLocal(dateStr, block, slot, rec);
      openAttKey = null;
      renderCardView();
      await pushRecord(dateStr, dayNameForDate(dateStr), block, slot, rec);
    };
  });

  // 지각/결석 사유 메모
  document.querySelectorAll('#dayPanel .reason-add').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      openStatusKey = el.getAttribute('data-key');
      renderCardView();
    };
  });
  document.querySelectorAll('#dayPanel .statusSave').forEach(el=>{
    el.onclick = async (e)=>{
      e.stopPropagation();
      const key = el.getAttribute('data-key');
      const [dateStr, block, slotStr] = key.split("|");
      const slot = parseInt(slotStr);
      const input = document.querySelector(`.statusInput[data-key="${key}"]`);
      const rec = getRec(dateStr, block, slot);
      rec.statusNote = input.value.trim();
      setRecLocal(dateStr, block, slot, rec);
      openStatusKey = null;
      renderCardView();
      await pushRecord(dateStr, dayNameForDate(dateStr), block, slot, rec);
    };
  });

  // 보강 완료 토글
  document.querySelectorAll('#dayPanel .makeup-toggle').forEach(el=>{
    el.onclick = async (e)=>{
      e.stopPropagation();
      const key = el.getAttribute('data-key');
      const [dateStr, block, slotStr] = key.split("|");

      const rec = getRec(dateStr, block, slot);

      if(rec.makeupDone){
        const d = new Date();
        const days=["일","월","화","수","목","금","토"];
        rec.makeupDate = `${d.getMonth()+1}/${d.getDate()}(${days[d.getDay()]}) ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      } else {

    };
  });

  // 숙제 상태 버튼 (완료→미완료→미확인 순환)
  document.querySelectorAll('#dayPanel .hw-status-btn').forEach(el=>{
    el.onclick = async ()=>{

      const [dateStr, block, name] = key.split("|");
      const input = document.querySelector(`.hwMemoInput[data-key="${key}"]`);
      const rec = getHwRec(dateStr, block, name);
      rec.memo = input.value.trim();
      setHwRecLocal(dateStr, block, name, rec);
      openHwMemoKey = null;
      renderCardView();
      await pushHomeworkRecord(dateStr, dayNameForDate(dateStr), block, name, rec);
    };
  });
}

/* ============ 오늘의 미체크 학생 ============ */
function renderUnchecked(){
  const listEl = document.getElementById('uncheckedList');
  const labelEl = document.getElementById('uncheckedDateLabel');
  if(!listEl) return;

  const today = new Date();
  const todayStr = toDateStr(today);
  const days=["일","월","화","수","목","금","토"];
  labelEl.textContent = `(${today.getMonth()+1}월 ${today.getDate()}일 ${days[today.getDay()]})`;

  const todayWeekStart = mondayOf(today);
  // 현재 표시중인 주가 오늘이 속한 주가 아니면, records에 오늘 데이터가 없을 수 있음을 감안
  const dayName = dayNameForDate(todayStr);
  const sameWeek = toDateStr(todayWeekStart) === toDateStr(weekStart);

  let items = [];
  if(dayName && roster[dayName]){
    BLOCKS.forEach(block=>{
      const names = roster[dayName][block];
      for(let s=0;s<SUB;s++){
        const name = names[s];
        if(!name || !name.trim()) continue;
        const rec = sameWeek ? getRec(todayStr, block, s) : {status:"normal"};
        if(rec.status === "normal" || !rec.status){
          items.push({name, block});
        }
      }
    });
  }

  if(!sameWeek){
    listEl.innerHTML = `<div class="unchecked-empty">현재 보고 있는 주가 오늘이 아니라 정확한 미체크 현황을 알 수 없어요.</div>`;
    return;
  }
  if(!items.length){
    listEl.innerHTML = `<div class="unchecked-empty">오늘 배정된 학생은 모두 출결 체크를 완료했어요.</div>`;
    return;
  }
  listEl.innerHTML = items.map(it=>{
    const stu = parseStudentEntry(it.name);
    const meta = [stu.school, stu.grade].filter(Boolean).join(' · ');
    return `<div class="unchecked-item"><span><span class="uc-name">${stu.name}</span>${meta?` <span class="uc-block">${meta}</span>`:''}</span><span class="uc-block">${it.block}</span></div>`;
  }).join("");
}

// 월 전체 기록을 주 단위로 나눠 불러와 monthRecords에 채운다 (기존 records API 재사용)
async function loadMonthRecords(){
  monthRecords = {};
  if(!selectedStudent) return;
  const first = new Date(calMonth.getFullYear(), calMonth.getMonth(), 1);
  const last = new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 0);
  let cursor = mondayOf(first);
  const weeks = [];
  while(cursor <= last){
    weeks.push(new Date(cursor));
    cursor = addDays(cursor, 7);
  }
  for(const ws of weeks){
    try{
      const rows = await apiGet({action:"records", weekStart: toDateStr(ws)});
      rows.forEach(rec=>{
        // 학생 이름은 records에 직접 없으므로 roster로 block+slot -> 이름 매칭
        const dayName = dayNameForDate(rec.date);
        const names = roster[dayName] ? roster[dayName][rec.block] : null;
        if(!names) return;
        const slotIdx = (parseInt(rec.slot)||1)-1;
        if(names[slotIdx] && names[slotIdx].trim()===selectedStudent){
          monthRecords[rec.date] = rec.status;
        }
      });
    }catch(e){}
  }
}

function renderCalendar(){
  document.getElementById('calLabel').textContent = `${calMonth.getFullYear()}년 ${calMonth.getMonth()+1}월`;
  const grid = document.getElementById('calGrid');
  const dowNames = ["일","월","화","수","목","금","토"];
  let html = dowNames.map(d=>`<div class="cal-dow">${d}</div>`).join("");

  const first = new Date(calMonth.getFullYear(), calMonth.getMonth(), 1);
  const startPad = first.getDay();
  const daysInMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 0).getDate();

  for(let i=0;i<startPad;i++) html += `<div class="cal-cell pad"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const d = new Date(calMonth.getFullYear(), calMonth.getMonth(), day);
    const dateStr = toDateStr(d);
    const status = monthRecords[dateStr];
    let cls = "";
    if(status==='present') cls='present'; else if(status==='late') cls='late'; else if(status==='absent') cls='absent';
    html += `<div class="cal-cell ${cls}"><span class="dnum">${day}</span>${cls?'<span class="mark"></span>':''}</div>`;
  }
  grid.innerHTML = html;
}

  await renderMakeupFeed();
  await renderReasonFeed();
}

async function renderMakeupFeed(){
  const el = document.getElementById('makeupFeed');
  const labelEl = document.getElementById('makeupCountLabel');
  if(!el) return;

  const today = new Date();
  const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
  let cursor = mondayOf(monthStart);
  const weeks = [];
  while(cursor <= today){
    weeks.push(new Date(cursor));
    cursor = addDays(cursor, 7);
  }

  const items = [];
  for(const ws of weeks){
    try{
      const rows = await apiGet({action:"records", weekStart: toDateStr(ws)});
      rows.forEach(rec=>{
        if(rec.status !== 'absent') return;
        if(rec.makeupDone) return;
        if(rec.date < toDateStr(monthStart) || rec.date > toDateStr(today)) return;
        const dayName = dayNameForDate(rec.date);
        const names = roster[dayName] ? roster[dayName][rec.block] : null;
        const slotIdx = (parseInt(rec.slot)||1)-1;
        const rawName = (names && names[slotIdx]) ? names[slotIdx] : '';
        if(!rawName) return;
        items.push({ date: rec.date, block: rec.block, note: rec.statusNote||"", name: rawName });
      });
    }catch(e){}
  }

  items.sort((a,b)=> a.date.localeCompare(b.date) || a.block.localeCompare(b.block));

  if(labelEl) labelEl.innerHTML = items.length ? `<span class="badge-count">${items.length}건</span>` : '';

  if(!items.length){
    el.innerHTML = `<div class="reason-feed-empty">이번 달 보강 대기 건이 없어요.</div>`;
    return;
  }

  const days=["일","월","화","수","목","금","토"];
  el.innerHTML = items.map(it=>{
    const stu = parseStudentEntry(it.name);
    const meta = [stu.school, stu.grade].filter(Boolean).join(' · ');
    const d = new Date(it.date+"T00:00:00");
    const dateLabel = `${d.getMonth()+1}/${d.getDate()} (${days[d.getDay()]})`;
    return `<div class="reason-item">
      <span class="ri-badge absent">결석</span>
      <div class="ri-body">
        <div class="ri-top">
          <span class="ri-name">${stu.name}</span>
          ${meta?`<span class="ri-meta">${meta}</span>`:''}
          <span class="ri-date">${dateLabel} · ${it.block}</span>
        </div>
        ${it.note ? `<div class="ri-text">사유: ${it.note}</div>` : ''}
      </div>
    </div>`;
  }).join("");
}

function renderDashSummary(){
  const el = document.getElementById('dashSummary');
  if(!el) return;

  const today = new Date();
  const todayStr = toDateStr(today);
  const dayName = dayNameForDate(todayStr);
  const sameWeek = toDateStr(mondayOf(today)) === toDateStr(weekStart);

  let totalStudents=0, uncheckedCount=0, checkedInCount=0, checkedOutCount=0;
  let hwDone=0, hwTotal=0;

  if(dayName && roster[dayName]){
    BLOCKS.forEach(block=>{
      const names = roster[dayName][block];
      for(let s=0;s<SUB;s++){
        const name = names[s];
        if(!name || !name.trim()) continue;
        totalStudents++;
        const rec = sameWeek ? getRec(todayStr, block, s) : {status:"normal"};
        if(rec.status === "normal" || !rec.status) uncheckedCount++;
        if(rec.checkIn) checkedInCount++;
        if(rec.checkOut) checkedOutCount++;

        hwTotal++;
        const hw = sameWeek ? getHwRec(todayStr, block, name) : {completed:"미확인"};
        if(hw.completed === "완료") hwDone++;
      }
    });
  }

  const hwRate = hwTotal ? Math.round((hwDone/hwTotal)*100) : 0;
  const cards = [
    { label:"오늘 미체크 학생", value: sameWeek ? uncheckedCount : '-', unit:"명", accent:"accent-red" },
    { label:"오늘 등원 완료", value: sameWeek ? checkedInCount : '-', unit:`/ ${totalStudents}명`, accent:"accent-teal" },
    { label:"오늘 하원 완료", value: sameWeek ? checkedOutCount : '-', unit:`/ ${totalStudents}명`, accent:"accent-blue" },
    { label:"오늘 숙제 완료율", value: sameWeek ? hwRate : '-', unit:"%", accent:"" }
  ];

  el.innerHTML = cards.map(c=>
    `<div class="dash-card ${c.accent}"><div class="dc-label">${c.label}</div><div class="dc-value">${c.value}<span class="unit">${c.unit}</span></div></div>`
  ).join("");
}

async function renderReasonFeed(){
  const el = document.getElementById('reasonFeed');
  if(!el) return;

  const today = new Date();
  const start = addDays(today, -13); // 오늘 포함 최근 14일
  let cursor = mondayOf(start);
  const weeks = [];
  while(cursor <= today){
    weeks.push(new Date(cursor));
    cursor = addDays(cursor, 7);
  }

  const items = [];
  for(const ws of weeks){
    try{
      const rows = await apiGet({action:"records", weekStart: toDateStr(ws)});
      rows.forEach(rec=>{
        if(!rec.statusNote) return;
        if(rec.date < toDateStr(start) || rec.date > toDateStr(today)) return;
        if(rec.status !== 'late' && rec.status !== 'absent') return;
        const dayName = dayNameForDate(rec.date);
        const names = roster[dayName] ? roster[dayName][rec.block] : null;
        const slotIdx = (parseInt(rec.slot)||1)-1;
        const rawName = (names && names[slotIdx]) ? names[slotIdx] : '';
        if(!rawName) return;
        items.push({ date: rec.date, block: rec.block, status: rec.status, note: rec.statusNote, name: rawName });
      });
    }catch(e){}
  }

  items.sort((a,b)=> b.date.localeCompare(a.date) || b.block.localeCompare(a.block));

  if(!items.length){
    el.innerHTML = `<div class="reason-feed-empty">최근 2주간 지각·결석 사유가 없어요.</div>`;
    return;
  }

  const days=["일","월","화","수","목","금","토"];
  el.innerHTML = items.map(it=>{
    const stu = parseStudentEntry(it.name);
    const meta = [stu.school, stu.grade].filter(Boolean).join(' · ');
    const d = new Date(it.date+"T00:00:00");
    const dateLabel = `${d.getMonth()+1}/${d.getDate()} (${days[d.getDay()]})`;
    const badgeLabel = it.status === 'late' ? '지각' : '결석';
    return `<div class="reason-item">
      <span class="ri-badge ${it.status}">${badgeLabel}</span>
      <div class="ri-body">
        <div class="ri-top">
          <span class="ri-name">${stu.name}</span>
          ${meta?`<span class="ri-meta">${meta}</span>`:''}
          <span class="ri-date">${dateLabel} · ${it.block}</span>
        </div>
        <div class="ri-text">${it.note}</div>
      </div>
    </div>`;
  }).join("");
}


function switchPage(page){
  currentPage = page;
  document.getElementById('pageTitle').textContent = PAGE_TITLES[page];
  document.querySelectorAll('.nav-item[data-page]').forEach(b=>{
    b.classList.toggle('active', b.getAttribute('data-page')===page);
  });

  const attPage = document.getElementById('attendancePage');
  const otherPage = document.getElementById('otherPage');
  const topActions = document.getElementById('attendanceTopActions');

  if(page === 'attendance'){
    attPage.style.display = '';
    otherPage.style.display = 'none';
    topActions.style.display = '';
    return;
  }

  attPage.style.display = 'none';
  topActions.style.display = 'none';
  otherPage.style.display = '';
  if(page === 'dashboard'){
    otherPage.innerHTML = `<div class="dash-summary" id="dashSummary"></div>
      <div class="panel" style="margin-bottom:20px;">
        <h2>이번 달 보강 대기 <span class="sub" id="makeupCountLabel"></span></h2>
        <div class="reason-feed" id="makeupFeed"><div class="reason-feed-empty">불러오는 중...</div></div>
      </div>
      <div class="panel">
        <h2>최근 지각·결석 사유 <span class="sub">(최근 2주)</span></h2>
        <div class="reason-feed" id="reasonFeed"><div class="reason-feed-empty">불러오는 중...</div></div>
      </div>`;
    renderDashboard();
  } else if(page === 'students'){
    otherPage.innerHTML = emptyPagePanel('🧑‍🎓','학생 관리는 준비 중이에요','학생별 기본 정보, 학교, 반 편성을 관리하는 화면이 이곳에 들어올 예정이에요.');
  } else if(page === 'grades'){
    otherPage.innerHTML = emptyPagePanel('📝','성적 관리는 준비 중이에요','시험 성적과 진도 기록을 관리하는 화면이 이곳에 들어올 예정이에요.');
  }
}

document.querySelectorAll('.nav-item[data-page]').forEach(btn=>{
  btn.onclick = ()=> switchPage(btn.getAttribute('data-page'));
});
