<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학생 관리 시스템 | 수학의 결</title>
<link rel="apple-touch-icon" href="assets/logo-180.png">
<meta name="theme-color" content="#0C4642">
<style>
  :root{
    --teal:#224F42;            /* 학원 기준 틸 — 메인 포인트색(버튼·활성탭) */
    --teal-dark:#17362D;       /* 진한 틸 — 밝은 배경 위 텍스트/포인트 */
    --deep:#0C4642;            /* 가장 진한 틸 — 사이드바 배경 등 강한 강조면 */
    --soft:var(--soft);            /* 테마색의 연한 배경(배지·강조) — 색상 테마 선택 시 자동 계산 */
    --side-fg:#FFFFFF;         /* 사이드바 글자색(어두운 배경 위, 테마 밝기에 따라 자동 전환) */
    --side-fg-soft:rgba(255,255,255,.72);
    --side-fg-dim:rgba(255,255,255,.5);
    --blue:#2A6F8C;
    --green:#3F8C63;
    --yellow:#E7C468;
    --ink:#20261F;
    --ink-soft:#6B7570;
    --paper:#FBF6EC;
    --card:#FFFDF6;
    --line:#E3E7E2;
    --amber:#C98A2C;
    --red:#C0463A;
    --radius:14px;
    --sidebar-w:230px;
    --teal-ondark:#6FC7A8;     /* 어두운 배경(카드/페이지) 위 틸 텍스트 — 다크 테마 전용 */
    --gold:#C9A967;            /* 사이드바 포인트(골드) — 테마와 무관하게 고정 */
    --gold-rgb:201,169,103;
    --deep-rgb:12,70,66;       /* --deep(#0C4642)의 r,g,b — 유리 배경 그라데이션용, 테마 변경 시 JS가 갱신 */
    --teal-rgb:34,79,66;       /* --teal(#224F42)의 r,g,b */
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-size:16px;}
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;}
  /* ===================== 레이아웃 셸: 사이드바 + 메인 ===================== */
  #shell{display:flex;min-height:100vh;}
  /* 사이드바 뒤에 고정으로 깔리는 그라데이션 — 유리(사이드바)가 이걸 비춰서 은은하게 보이게 함 */
  #sidebarBackdrop{position:fixed;left:0;top:0;width:var(--sidebar-w);height:100vh;z-index:0;pointer-events:none;
    background-color:var(--deep);
    background-image:
      linear-gradient(rgba(0,0,0,.4), rgba(0,0,0,.4)),
      radial-gradient(circle at 20% 14%, rgba(var(--gold-rgb),.24) 0%, transparent 42%),
      radial-gradient(circle at 80% 62%, rgba(var(--teal-rgb),.48) 0%, transparent 48%),
      radial-gradient(circle at 35% 92%, rgba(var(--teal-rgb),.28) 0%, transparent 45%);}
  #sidebar{width:var(--sidebar-w);flex-shrink:0;color:var(--side-fg);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:1;
    background:rgba(255,255,255,.045);
    backdrop-filter:blur(14px) saturate(130%);-webkit-backdrop-filter:blur(14px) saturate(130%);
    border-right:1px solid rgba(255,255,255,.14);
    box-shadow:inset -1px 0 0 rgba(255,255,255,.05);}
  #sidebar::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(ellipse 200px 120px at 6% 4%, rgba(255,255,255,.14) 0%, transparent 65%);
    mix-blend-mode:screen;}
  .side-brand{display:flex;align-items:center;gap:12px;padding:22px 20px 18px;box-sizing:border-box;
    border-bottom:1px solid rgba(255,255,255,.12);position:relative;z-index:1;}
  .side-brand img{width:64px;height:64px;object-fit:contain;flex-shrink:0;
    filter:drop-shadow(0 3px 8px rgba(0,0,0,.3));}
  .side-brand .names{line-height:1.35;}
  .side-brand .t1{font-size:15.5px;font-weight:800;letter-spacing:-0.2px;}
  .side-brand .t2{font-size:11.5px;color:var(--side-fg-soft);}
  .side-brand-wordmark{flex-direction:column;justify-content:center;gap:8px;padding:22px 18px 18px;}
  .side-brand-wordmark img{width:150px;height:auto;flex-shrink:0;filter:drop-shadow(0 3px 8px rgba(0,0,0,.3));}
  .side-brand-caption{font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--side-fg-soft);text-align:center;}
  .side-nav{flex:1;padding:16px 12px;display:flex;flex-direction:column;gap:3px;position:relative;z-index:1;}
  .nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;
    font-size:14.5px;font-weight:800;color:var(--side-fg);cursor:pointer;border:1px solid transparent;background:none;
    width:100%;text-align:left;position:relative;overflow:hidden;}
  .nav-item .nav-emoji{font-size:16px;width:34px;height:34px;flex-shrink:0;border-radius:10px;
    display:flex;align-items:center;justify-content:center;line-height:1;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);
    filter:saturate(.65) brightness(1.05);}
  .nav-item:hover{background:rgba(127,127,127,.15);color:var(--side-fg);}
  .nav-item.active{
    background:linear-gradient(90deg,rgba(var(--gold-rgb),.16),rgba(255,255,255,.03));
    border-color:rgba(var(--gold-rgb),.35);
    color:#fff;}
  .nav-item.active .nav-emoji{opacity:1;border-color:rgba(var(--gold-rgb),.3);}
  .nav-item.new-badge{background:rgba(var(--gold-rgb),.08);border-color:rgba(var(--gold-rgb),.32);color:#f5dfaa;}
  .nav-item.new-badge:hover{background:rgba(var(--gold-rgb),.14);}
  .nav-item.new-badge .nav-emoji{color:var(--gold);}
  .side-foot{padding:16px 20px 20px;font-size:11px;color:var(--side-fg-dim);line-height:1.6;
    border-top:1px solid rgba(255,255,255,.12);position:relative;z-index:1;}
  /* 클릭 순간 골드 플래시 */
  .gold-flash{animation:navGoldFlash .5s ease;}
  @keyframes navGoldFlash{
    0%{box-shadow:0 0 0 rgba(var(--gold-rgb),0);}
    45%{box-shadow:0 0 22px rgba(var(--gold-rgb),.5),0 0 4px rgba(var(--gold-rgb),.4);}
    100%{box-shadow:0 0 0 rgba(var(--gold-rgb),0);}
  }
  .nav-item.active.gold-flash{box-shadow:0 0 22px rgba(var(--gold-rgb),.5);}
  #main{flex:1;min-width:0;display:flex;flex-direction:column;}
  #mainTopbar{background:var(--card);border-bottom:1px solid var(--line);
    padding:30.5px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  #mainTopbar h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-0.3px;}
  .tb-titles{display:flex;flex-direction:column;gap:3px;}
  .page-greeting{font-size:13px;font-weight:600;color:var(--teal-dark);}
  .topbar-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .date-picker{display:flex;align-items:center;gap:9px;background:var(--paper);
    border:1px solid var(--line);border-radius:11px;padding:11px 16px;font-size:14.5px;font-weight:600;}
  .date-picker input[type=date]{border:none;font-family:inherit;font-size:14.5px;font-weight:600;
    color:var(--ink);background:none;}
  .edit-toggle{background:var(--card);border:1.5px solid var(--teal);color:var(--teal);
    border-radius:11px;padding:11px 20px;font-size:14.5px;font-weight:700;cursor:pointer;}
  .edit-toggle.active{background:var(--teal);color:#fff;}
  .sync-status{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-soft);
    font-weight:600;white-space:nowrap;}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:#6FA05A;flex-shrink:0;}
  .sync-dot.busy{background:var(--yellow);animation:syncPulse 1s infinite;}
  .sync-dot.error{background:var(--red);}
  @keyframes syncPulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  @keyframes refreshSpin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  #pageContent{flex:1;padding:28px 32px 48px;}
  .empty-panel{background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);
    padding:70px 20px;text-align:center;color:var(--ink-soft);font-size:15px;}
  .empty-panel .big{font-size:38px;margin-bottom:12px;}
  .empty-panel .title{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:8px;}
  /* ===================== 섹션 탭 (출결/숙제) ===================== */
  .section-tabs{display:inline-flex;background:var(--card);border:1px solid var(--line);
    border-radius:11px;padding:4px;gap:3px;margin-bottom:18px;}
  .section-tab{padding:10px 26px;text-align:center;font-size:14.5px;font-weight:700;
    color:var(--ink-soft);background:none;border:none;border-radius:8px;cursor:pointer;}
  .section-tab.active{background:var(--deep);color:#fff;}
  /* ===================== 주간 탭바 ===================== */
  .weekbar{display:flex;align-items:center;justify-content:space-between;
    background:var(--card);border:1px solid var(--line);border-radius:12px 12px 0 0;
    padding:16px 22px;}
  .weekbar button{background:var(--paper);border:1px solid var(--line);font-size:18px;color:var(--teal);
    padding:9px 14px;cursor:pointer;border-radius:9px;}
  .weekbar .range{font-size:16px;font-weight:700;}
  .daytabs{display:flex;background:var(--card);border-left:1px solid var(--line);
    border-right:1px solid var(--line);}
  .daytab{flex:1;padding:14px 8px;text-align:center;font-size:14.5px;font-weight:700;
    color:var(--ink-soft);background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;}
  .daytab .d{font-size:12px;font-weight:400;color:var(--ink-soft);}
  .daytab.active{background:var(--paper);color:var(--teal-dark);border-bottom-color:var(--teal);}
  .daytab.holiday span:not(.holiday-name),.daytab.holiday .d{color:var(--red);}
  .daytab.holiday.active{background:#FBEAE7;}
  .holiday-name{font-size:9.5px;color:var(--red);font-weight:400;line-height:1.2;text-align:center;
    max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .daypanel{background:var(--card);border:1px solid var(--line);border-top:none;
    border-radius:0 0 12px 12px;padding:24px;}
  .time-label{font-size:13.5px;color:var(--teal-dark);font-weight:800;margin:20px 0 12px;}
  .time-label:first-child{margin-top:0;}
  .slot-group{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;align-items:start;}
  .slot-card{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:14px 16px;}
  /* "종료된 시간대" 카드: 요일/시간이 바뀌어 더 이상 쓰지 않는 과거 슬롯을 시각적으로 옅게 구분 */
  .slot-card-ended{opacity:.6;border-style:dashed;}
  .slot-times{font-size:12.5px;font-weight:700;color:var(--teal-dark);background:var(--soft);border-radius:7px;padding:4px 9px;margin:6px 0 8px;display:inline-block;}
  .slot-ended-badge{font-size:11px;font-weight:700;color:var(--ink-soft);background:var(--line);
    padding:2px 8px;border-radius:99px;vertical-align:middle;}
  /* ===================== 아이콘/이름/메모 ===================== */
  .slot-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;gap:8px;}
  .slot-name{font-size:15.5px;font-weight:700;}
  .slot-meta{font-size:12px;color:var(--ink-soft);font-weight:600;}
  .icon-btn{background:none;border:none;padding:2px;cursor:pointer;color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;}
  .icon-btn svg{width:18px;height:18px;}
  .icon-btn.on{color:var(--red);}
  .memo-box{font-size:12px;color:var(--ink-soft);background:var(--card);border-radius:7px;
    padding:6px 10px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .memo-box span:first-child{flex:1;min-width:0;}
  .memo-box.att{color:var(--teal-dark);background:var(--soft);}
  .memo-box.reason{color:var(--amber);background:#FBF2DD;margin-top:8px;}
  .memo-actions{display:flex;gap:2px;flex-shrink:0;}
  .memo-actions button{background:none;border:none;font-size:12px;cursor:pointer;
    padding:2px 5px;border-radius:5px;color:inherit;opacity:.75;line-height:1;}
  .memo-actions button:hover{opacity:1;background:rgba(0,0,0,0.06);}
  .reason-add{background:none;border:none;color:var(--ink-soft);font-size:11.5px;
    padding:5px 0 0;cursor:pointer;text-decoration:underline;}
  .memo-edit{display:flex;gap:6px;margin-bottom:8px;}
  .memo-edit input{flex:1;font-size:12.5px;border:1px solid var(--line);border-radius:8px;
    padding:6px 8px;font-family:inherit;}
  .memo-edit button{font-size:12px;border:none;background:var(--teal);color:#fff;
    border-radius:8px;padding:0 12px;cursor:pointer;}
  /* ===================== 출결 상태 버튼 ===================== */
  .status-row{display:flex;gap:6px;}
  .status-btn{flex:1;font-size:13px;font-weight:700;padding:9px 0;border-radius:9px;
    border:1px solid var(--line);background:var(--card);color:var(--ink-soft);cursor:pointer;}
  .status-btn.present.active{background:#6FA05A;color:#fff;border-color:#6FA05A;}
  .status-btn.late.active{background:var(--amber);color:#fff;border-color:var(--amber);}
  .status-btn.absent.active{background:var(--red);color:#fff;border-color:var(--red);}
  .empty-hint{color:var(--ink-soft);font-size:14.5px;text-align:center;padding:40px 0;}
  /* ===================== 보강 토글 ===================== */
  .makeup-toggle{display:block;width:100%;margin-top:8px;padding:8px 10px;font-size:12px;
    font-weight:700;border-radius:8px;border:1px dashed var(--teal);background:var(--soft);
    color:var(--teal-dark);cursor:pointer;text-align:center;}
  .makeup-toggle.done{border-style:solid;border-color:#6FA05A;background:#EAF3E5;color:#3D6B2E;}
  .makeup-toggle.waived{border-style:solid;border-color:var(--line);background:var(--paper);color:var(--ink-soft);}
  .makeup-add{display:block;width:100%;margin-top:8px;padding:6px 10px;font-size:11.5px;
    border-radius:8px;border:none;background:none;color:var(--ink-soft);cursor:pointer;
    text-align:center;text-decoration:underline;}
  /* ===================== 숙제 카드 (레거시 - 미사용) ===================== */
  .hw-status-btn{width:100%;display:flex;align-items:flex-start;justify-content:space-between;
    background:var(--card);border:1px solid var(--line);border-radius:9px;padding:11px 13px;
    cursor:pointer;text-align:left;margin-bottom:8px;}
  .hw-name{font-size:15px;font-weight:700;color:var(--ink);}
  .hw-status-label{font-size:12.5px;font-weight:700;color:var(--ink-soft);}
  .hw-status-btn.done{background:var(--teal);border-color:var(--teal);}
  .hw-status-btn.done .hw-name,.hw-status-btn.done .hw-status-label{color:#fff;}
  .hw-status-btn.missing{background:var(--red);border-color:var(--red);}
  .hw-status-btn.missing .hw-name,.hw-status-btn.missing .hw-status-label{color:#fff;}
  .hw-status-btn.unchecked{border-style:dashed;}
  /* ===================== 4칸 그리드 (출석/숙제/태도메모/숙제메모) ===================== */
  .quad-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:6px;}
  .quad-btn{display:flex;align-items:center;justify-content:center;
    border-radius:7px;height:34px;padding:0 2px;cursor:pointer;border:1px solid var(--line);background:var(--card);
    font-family:inherit;position:relative;}
  .quad-btn .qi{display:none;}
  .quad-btn .ql{font-size:13px;font-weight:400;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .quad-btn.memo{color:var(--ink-soft);border-color:var(--line);background:var(--card);}
  .quad-btn.memo.on{color:var(--teal-dark);border-color:var(--teal);background:var(--soft);}
  .quad-btn[disabled]{opacity:.4;cursor:default;}
  .quad-btn.chev::after{content:"";position:absolute;bottom:3px;right:5px;width:5px;height:5px;
    border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;
    transform:rotate(45deg);opacity:.6;}
  .quad-btn.att-unchecked{background:var(--paper);border:1px dashed var(--line);color:var(--ink-soft);}
  .quad-btn.att-present{background:#5DCAA5;border-color:#5DCAA5;color:#04342C;}
  .quad-btn.att-late{background:#9FE1CB;border:1.5px solid var(--deep);color:var(--ink);}
  .quad-btn.att-absent{background:#E1F5EE;border:1.5px solid var(--deep);color:var(--ink);}
  .quad-btn.hw-done{background:#5DCAA5;border-color:#5DCAA5;color:#04342C;}
  .quad-btn.hw-partial{background:#9FE1CB;border:1.5px solid var(--deep);color:var(--ink);}
  .quad-btn.hw-missing{background:#F7D9CF;border:1.5px solid var(--red);color:var(--ink);}
  .quad-btn.hw-unchecked{background:var(--paper);border-style:dashed;color:var(--ink-soft);}
  .quad-btn.hw-off{background:var(--paper);color:var(--ink-soft);opacity:.45;cursor:default;}
  .quad-sub{font-size:12px;color:var(--teal-dark);background:var(--soft);border-radius:7px;
    padding:6px 10px;margin-top:2px;margin-bottom:8px;}
  .quad-sub.muted{color:var(--ink-soft);background:none;padding:2px 0;}
  /* ===================== 명단 편집 ===================== */
  #editView{display:none;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:26px;}
  .edit-hint{font-size:13.5px;color:var(--ink-soft);margin-bottom:18px;line-height:1.6;}
  .edit-day{font-size:16px;font-weight:800;margin:20px 0 10px;color:var(--teal-dark);}
  .edit-day:first-child{margin-top:0;}
  .edit-block{background:var(--paper);border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;margin-bottom:8px;}
  .edit-block .lbl{font-size:12px;color:var(--ink-soft);margin-bottom:8px;font-weight:700;}
  .edit-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .edit-grid input{font-size:13.5px;border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;font-family:inherit;}
  .edit-slot{display:flex;flex-direction:column;gap:4px;}
  .edit-eff-row{display:flex;align-items:center;gap:6px;background:#FBF2DD;border:1px solid var(--amber);
    border-radius:7px;padding:5px 8px;}
  .edit-eff-row label{font-size:10.5px;color:var(--amber);font-weight:700;white-space:nowrap;}
  .edit-eff-row input{flex:1;font-size:12px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;}
  /* ===================== 하단: 미체크 + 학생별 이력 ===================== */
  .bottom-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px;}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;}
  .panel h2{font-size:16px;font-weight:800;margin:0 0 16px;display:flex;align-items:center;
    justify-content:space-between;}
  .panel h2 .sub{font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  .panel h2 .badge-count{font-size:12px;font-weight:800;padding:3px 10px;border-radius:20px;
    background:var(--red);color:#fff;}
  /* ===================== 대시보드 ===================== */
  .dash-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
  @media (max-width: 900px){ .dash-summary{grid-template-columns:repeat(2,1fr);} }
  .dash-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px 22px;}
  .dash-card .dc-label{font-size:13px;color:var(--ink-soft);font-weight:700;margin-bottom:8px;}
  .dash-card .dc-value{font-size:30px;font-weight:800;color:var(--ink);line-height:1.2;}
  .dash-card .dc-value .unit{font-size:15px;font-weight:700;color:var(--ink-soft);margin-left:2px;}
  .dash-card.accent-red .dc-value{color:var(--red);}
  .dash-card.accent-teal .dc-value{color:var(--teal);}
  .dash-card.accent-blue .dc-value{color:var(--blue);}
  /* 대시보드 상단 오늘의 문구 카드 — 통계 칸 옆 빈 자리를 채우는 용도, dash-summary 그리드 안에 함께 놓인다 */

  /* ===================== 당겨서 새로고침(pull-to-refresh) ===================== */
  #ptrIndicator{display:flex;align-items:center;justify-content:center;
    height:0;overflow:hidden;color:var(--teal-dark);font-size:13px;font-weight:700;gap:8px;
    transition:height .15s;}
  #ptrIndicator svg{width:18px;height:18px;flex-shrink:0;}
  #ptrIndicator.ready svg{transform:rotate(180deg);}
  #ptrIndicator.loading svg{animation:refreshSpin .7s linear infinite;}
  /* ===================== 저장 실패 알림 토스트 ===================== */
  #saveToast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);

    box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:999;opacity:0;pointer-events:none;
    transition:opacity .2s, transform .2s;display:flex;align-items:center;gap:10px;}
  #saveToast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #saveToast svg{width:18px;height:18px;flex-shrink:0;}
  /* ===================== 문제은행 ===================== */
  .fb{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:18px;}
  .fb-row{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;}
  .fb-group{display:flex;flex-direction:column;gap:6px;}
  .fb-group label{font-size:11.5px;font-weight:700;color:var(--ink-soft);}
  .fb-select{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);
    font-size:13.5px;color:var(--ink);min-width:130px;}
  .fb-search{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--paper);
    font-size:13.5px;min-width:180px;}
  .chipset{display:flex;gap:6px;}
  .chip{padding:7px 13px;border-radius:20px;border:1.4px solid var(--line);background:var(--card);
    font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer;user-select:none;}
  .chip.on{background:var(--teal);border-color:var(--teal);color:#fff;}
  .fb-check{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);font-weight:600;cursor:pointer;}
  .fb-check input{accent-color:var(--teal);width:15px;height:15px;}
  .fb-divider{width:1px;align-self:stretch;background:var(--line);margin:0 2px;}

  .result-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
  .result-count{font-size:13.5px;color:var(--ink-soft);}
  .result-count b{color:var(--teal-dark);}
  .select-all{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--teal-dark);cursor:pointer;}
  .select-all input{accent-color:var(--teal);width:16px;height:16px;}

  .pb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
  .pb-card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);overflow:hidden;
    cursor:pointer;transition:border-color .12s;position:relative;}
  .pb-card:hover{border-color:var(--teal);}
  .pb-card.sel{border-color:var(--teal);box-shadow:0 0 0 2px rgba(34,79,66,.18);}
  .pb-card.hidden{display:none;}
  .pb-check{position:absolute;top:10px;left:10px;width:22px;height:22px;border-radius:6px;
    border:2px solid #fff;background:rgba(23,59,51,.35);z-index:2;display:flex;align-items:center;justify-content:center;}
  .pb-card.sel .pb-check{background:var(--teal);border-color:var(--teal);}
  .pb-check svg{width:13px;height:13px;stroke:#fff;stroke-width:3;fill:none;opacity:0;}
  .pb-card.sel .pb-check svg{opacity:1;}
  .pb-thumb{width:100%;aspect-ratio:280/230;object-fit:contain;
    background:var(--paper);display:block;border-bottom:1px solid var(--line);padding:6px;box-sizing:border-box;}
  .pb-body{padding:10px 12px 12px;}
  .pb-id{font-size:11.5px;font-weight:800;color:var(--teal-dark);letter-spacing:.02em;margin-bottom:6px;}
  .pb-tags{display:flex;flex-wrap:wrap;gap:5px;}
  .pb-tag{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--soft);color:var(--teal-dark);}
  .pb-tag.level3{background:#FDEDEA;color:#A8402F;}
  .pb-tag.level2{background:#FFF6E2;color:#8A6D1A;}
  .pb-tag.level1{background:var(--soft);color:var(--teal-dark);}
  .pb-tag.nosol{background:#EEF0F1;color:#6B7B77;}
  .pb-tag.grade{background:var(--teal);color:#fff;}

  .nav-item.new-badge::after{content:"NEW";position:absolute;right:10px;top:9px;font-size:8.5px;
    font-weight:800;background:var(--gold);color:#1d312b;padding:1px 5px;border-radius:20px;}

  #pbStickyBar{position:fixed;left:var(--sidebar-w);right:0;bottom:0;background:var(--deep);color:#fff;
    padding:14px 28px;display:none;align-items:center;justify-content:space-between;gap:14px;
    box-shadow:0 -4px 18px rgba(0,0,0,.12);z-index:10;}

  .sb-left{font-size:14.5px;font-weight:700;}

  /* 문제은행 인쇄용 화면(시험지·해설지)은 실제 종이에 인쇄되므로, 다크 테마와 무관하게
     항상 밝은 배경 + 어두운 글자를 쓴다. 아래에서 --ink/--ink-soft/--teal-dark/--line을
     원래(라이트) 값으로 되돌려서, 이 안에서 var(--ink) 등을 쓰는 모든 요소에 그대로 적용되게 한다. */
  #pbPrintView{position:fixed;inset:0;background:#5C6E69;display:none;z-index:30;overflow:auto;

    padding:8mm;position:relative;box-sizing:border-box;}
  .ws-cover{display:flex;flex-direction:column;}
  .ws-cover-title{font-size:32px;font-weight:900;color:var(--ink);margin-top:130px;}
  .ws-cover-sub2{font-size:16px;color:var(--ink-soft);margin-top:8px;}
  .ws-cover-levels{display:flex;gap:6px;margin-top:14px;}
  .ws-level-chip{font-size:12px;font-weight:800;padding:4px 12px;border-radius:20px;}
  .ws-level-chip.lv-상{background:#FDEDEA;color:#A8402F;}
  .ws-level-chip.lv-중{background:#FFF6E2;color:#8A6D1A;}
  .ws-level-chip.lv-하{background:var(--soft);color:var(--teal-dark);}
  .ws-cover-sub{font-size:13px;color:var(--ink-soft);margin-top:16px;}
  .ws-cover-note{font-size:11.5px;color:var(--ink-soft);margin-top:14px;line-height:1.6;}
  .ws-cover-fields{display:flex;gap:24px;margin-top:auto;padding-top:60px;}
  .ws-field{flex:1;border-top:1.4px solid var(--line);padding-top:8px;font-size:12px;color:var(--ink-soft);}
  .ws-cover-logo{text-align:center;margin-top:26px;}
  .ws-cover-logo img{width:70mm;height:auto;image-rendering:-webkit-optimize-contrast;}

  .ws-head{font-size:11px;color:var(--ink-soft);
    border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:4mm;}
  .ws-grid{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:min-content;row-gap:56mm;column-gap:4mm;
    align-content:start;}
  .ws-slot{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;padding:1.5mm;box-sizing:border-box;}
  .ws-slot.ws-empty{border:1px dashed var(--line);}
  .ws-slot img{max-width:100%;max-height:100%;object-fit:contain;}
  .ws-badge{position:absolute;top:6px;left:6px;background:var(--teal);color:#fff;font-size:12px;
    font-weight:800;width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;z-index:2;}
  .ws-badge.sm{position:static;margin-bottom:8px;width:auto;height:auto;padding:4px 9px;border-radius:7px;display:inline-flex;}
  .ws-foot{position:absolute;bottom:5mm;left:8mm;right:8mm;display:flex;align-items:center;
    justify-content:space-between;font-size:11px;color:var(--ink-soft);}
  .ws-foot-spacer{width:26mm;}
  .ws-foot-page{flex:1;text-align:center;}
  .ws-foot-logo{width:26mm;display:flex;justify-content:flex-end;}
  .ws-foot-logo img{max-height:10mm;max-width:26mm;object-fit:contain;}

  .ws-solution .ws-sol-flow{column-count:2;column-gap:10mm;}
  .ws-sol-item{break-inside:avoid;margin-bottom:10mm;}
  .ws-sol-item img{width:100%;border-radius:6px;border:1px solid var(--line);margin-bottom:4mm;}

  /* ===== 다크 테마 보정: 밝은 파스텔 배경 카드 위의 글자는 항상 어둡게 고정 ===== */
  .quad-btn.att-late,.quad-btn.att-absent,.quad-btn.hw-partial,.quad-btn.hw-missing{color:#1B3A30;}
  .cal-cell.present,.cal-cell.late,.cal-cell.absent{color:#1B3A30;}
  .cc-exam.math-warn .cc-name,.cc-exam.math-warn .cc-math{color:#1B3A30;}
  .daytab.holiday.active{color:#1B3A30;}

  @media (max-width:760px){
    #pbStickyBar{left:0;}
  }

  @page{size:A4;margin:0;}
  @media print{
    body *{visibility:hidden;}
    #pbPrintView, #pbPrintView *{visibility:visible;}
    #pbPrintView{position:absolute;inset:0;background:#fff;overflow:visible;}
    #pbPrintToolbar{display:none;}
    .ws-section-label{display:none;}
    #pbPrintPages{padding:0;gap:0;}
    .ws-page{box-shadow:none;page-break-after:always;margin:0 auto;}
  }
</style>
</head>

<script>
/* ============ 기존 attendance.html과 동일한 데이터/동기화 레이어 ============ */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzSVS9mzGr116jePeDPKV1lesU4hI7wIm_11yjYaYruLS38kWj32-E_QHEny3K8l00E/exec";
/* ============ 문제은행: 상태 & 인쇄용 로고 ============ */
let pbProblems = [];
let pbLoaded = false;
const pbSelected = new Set();
const PB_LOGO_URL = "assets/logo-rounded.png"; // 2026-09: 초기 로딩 속도 개선 -- 대형 base64 문자열 대신 파일 URL 사용 (문제은행 인쇄 시에만 쓰임)
const PB_WORDMARK_URL = "assets/pb-wordmark.png"; // 2026-09: 위와 동일한 이유로 base64 -> 파일 URL 전환
const DAYS = ["월","화","수","목","금","토"];
const BLOCKS = ["10:00","10:30","11:00","11:30","12:00","12:30","13:00","13:30","14:00","14:30","15:00","15:30","16:00","16:30","17:00","17:30","18:00","18:30","19:00","19:30","20:00"];
const SUB = 4;
const STATUS_LABEL = {present:"출석", late:"지각", absent:"결석"};
function pad(n){return n<10?"0"+n:""+n;}
function toDateStr(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function mondayOf(d){ const day=d.getDay(); const diff=day===0?-6:1-day; const r=new Date(d); r.setDate(d.getDate()+diff); r.setHours(0,0,0,0); return r; }
function addDays(d,n){const r=new Date(d); r.setDate(r.getDate()+n); return r;}
function fmtMD(d){return pad(d.getMonth()+1)+"/"+pad(d.getDate());}
let weekStart = mondayOf(new Date());
let selectedDate = new Date();
let roster = {};
let records = {};       // 이번 주 기록 (카드/테이블 뷰용)
let homeworkRecords = {}; // 이번 주 숙제 기록
let monthRecords = {};  // 학생별 캘린더용 (월 단위)
let activeDayIdx = (new Date().getDay()+6)%7;
if(activeDayIdx>5) activeDayIdx = 0;
let calMonth = new Date(); calMonth.setDate(1);
let tuitionMonth = new Date(); tuitionMonth.setDate(1);
function toYearMonth(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1); }
function addMonths(d,n){ const r=new Date(d); r.setDate(1); r.setMonth(r.getMonth()+n); return r; }
let selectedStudent = '';
let editMode = false;
let openAttKey = null;    // 메모(특이사항) 편집중인 카드 키
let openStatusKey = null; // 지각/결석 사유 메모 편집중인 카드 키
let openHwMemoKey = null; // 숙제 메모 편집중인 카드 키
let openMakeupDateKey = null; // 보강 예정일 편집중인 카드 키
let holidays = {}; // { "YYYY-MM-DD": "공휴일명" }
const HW_CYCLE = {"완료":"미흡", "미흡":"안함", "안함":"미확인", "미확인":"완료", "미완료":"안함"};
function hwStatusLabel(v){
  if(v === "완료") return "완료";
  if(v === "미흡" || v === "미완료") return "미흡";
  if(v === "안함") return "안함";
  if(v === "미확인" || !v) return "미확인";
  return "미확인";
}
let rosterHistory = []; // 서버가 내려주는 명단 이력 원본: [{day, block, slot, name, effectiveFrom}, ...]
// 특정 (요일,시간,슬롯)에 대해, 주어진 날짜(dateStr) 기준으로 유효했던 이름을 계산한다.
// effectiveFrom이 없는(예전 방식) 행은 항상 유효한 것으로 보고, effectiveFrom이 있는 행들 중에는
// dateStr 이전(또는 같은 날)에 시작된 것 중 가장 최근 것을 채택한다.
function rosterNameAt(day, block, slot, dateStr){
  const candidates = rosterHistory.filter(it =>
    it.day === day && String(it.block).trim() === String(block).trim() && String(it.slot) === String(slot + 1)
  );
  if(!candidates.length) return "";
  let best = null;
  candidates.forEach(it=>{
    if(!it.effectiveFrom){
      // 예전 방식(시작일 없음) 레거시 행: 같은 슬롯에 이런 행이 실수로 여러 개 남아있을 수 있으므로,
      // 이름이 있는 레거시 행을 이름이 없는 레거시 행보다 우선한다 — 빈 이름 잔여 행이 먼저 채택되어
      // 실제 유효했던 학생 이름을 가려버리는 문제를 막기 위함.
      if(!best || (!best.effectiveFrom && !best.name && it.name)) best = it;
      return;
    }
    if(it.effectiveFrom <= dateStr){
      if(!best || !best.effectiveFrom || it.effectiveFrom > best.effectiveFrom) best = it;
    }
  });
  return best ? (best.name || "") : "";
}
function emptyRoster(){
  const r={};
  DAYS.forEach(d=>{ r[d]={}; BLOCKS.forEach(b=>{ r[d][b]=["","","",""]; }); });
  return r;
}
// 2026-09: 대시보드 등에서 여러 GET 요청이 한꺼번에 몰릴 때 동시 요청 수를 제한해
// Apps Script 백엔드에 부담을 줄인다 (초기 로딩 속도 개선 -- 서버는 그대로 두고 클라이언트에서 처리).
const API_CONCURRENCY_LIMIT = 4;
let apiActiveCount = 0;
const apiWaitQueue = [];
function apiAcquireSlot(){
  if(apiActiveCount < API_CONCURRENCY_LIMIT){
    apiActiveCount++;
    return Promise.resolve();
  }
  return new Promise(resolve => apiWaitQueue.push(resolve));
}
function apiReleaseSlot(){
  const next = apiWaitQueue.shift();
  if(next) next(); // 대기 중이던 요청에게 슬롯을 그대로 넘김 (apiActiveCount 변화 없음)
  else apiActiveCount--;
}
async function apiGetOnce(params){
  await apiAcquireSlot();
  try{
    const url = SCRIPT_URL + "?" + new URLSearchParams({...params, _t: Date.now()}).toString();
    const res = await fetch(url, { cache: "no-store" });
    if(!res.ok) throw new Error("HTTP "+res.status);
    return await res.json();
  } finally {
    apiReleaseSlot();
  }
}
async function apiGet(params){
  let lastErr;
  for(let attempt=0; attempt<3; attempt++){
    try{
      return await apiGetOnce(params);
    }catch(e){
      lastErr = e;
      if(attempt<2) await new Promise(r=>setTimeout(r, 800));
    }
  }
  throw lastErr;
}
async function apiPost(body){
  await fetch(SCRIPT_URL, {
    method:"POST",
    mode:"no-cors",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify(body)
  });
  return {status:"ok"};
}
// Apps Script 웹앱은 doPost 응답에 CORS 헤더를 붙일 수 없어(플랫폼 자체 제약),
// POST는 no-cors로만 보낼 수 있고 브라우저가 응답 내용을 절대 읽지 못한다.
// 그래서 파일 업로드처럼 결과값(생성된 파일 ID 등)이 꼭 필요한 요청은,
// no-cors POST로 업로드를 요청해 서버가 CacheService에 결과를 잠시 저장하게 하고,
// 그 결과를 CORS 문제가 없는 GET(apiGet)으로 폴링해서 가져오는 방식을 쓴다.
// Apps Script 웹앱은 doPost 응답에 CORS 헤더를 붙일 수 없어(플랫폼 자체 제약) POST는 no-cors로만
// 보낼 수 있고, 응답을 읽으려는 시도(GET 폴링 포함)는 exec URL의 내부 리다이렉트와 맞물려 불안정했다.
// 그래서 파일 업로드는 결과를 돌려받지 않는 fire-and-forget으로 보내고, 서버(uploadNoticeAttachment)가
// "공지사항" 시트에 첨부 정보를 직접 기록하게 한다. 클라이언트는 업로드가 실제로 끝날 시간을 확보하기
// 위해 잠시 대기만 한다.
async function uploadFileAndWait(fileName, base64Data, mimeType){
  await apiPost({ action:'uploadNoticeAttachment', fileName, base64Data, mimeType });
  await new Promise(r=>setTimeout(r, 4000)); // 업로드+시트 기록이 끝날 시간을 확보
}
let saveToastTimer = null;
function showSaveFailToast(msg){
  const el = document.getElementById('saveToast');
  if(!el) return;
  document.getElementById('saveToastText').textContent = msg || '저장에 실패했어요. 인터넷 연결을 확인해주세요.';
  el.classList.add('show');
  if(saveToastTimer) clearTimeout(saveToastTimer);
  saveToastTimer = setTimeout(()=> el.classList.remove('show'), 4000);
}
// roster는 "오늘 기준 유효 명단"의 캐시 — 명단 편집 화면, 학생 목록 등
// "지금 현재"를 다루는 화면에서 그대로 사용한다. 특정 과거/미래 날짜를 기준으로 카드를
// 그릴 때는 rosterNameAt()으로 그 날짜에 맞는 이름을 다시 계산해서 써야 한다.
async function loadRoster(){
  try{
    const rows = await apiGet({action:"roster"});
    rosterHistory = rows.map(item => ({
      day: item.day, block: item.block, slot: item.slot,
      name: item.name || "", effectiveFrom: item.effectiveFrom || ""
    }));
    const todayStr = toDateStr(new Date());
    const r = emptyRoster();
    DAYS.forEach(day=>{
      BLOCKS.forEach(block=>{
        for(let s=0; s<SUB; s++){
          r[day][block][s] = rosterNameAt(day, block, s, todayStr);
        }
      });
    });
    roster = r;
  }catch(e){
    if(!roster || !Object.keys(roster).length) roster = emptyRoster();
    showSaveFailToast('명단을 불러오지 못했어요. 새로고침해서 다시 시도해주세요.');
  }
}
async function loadRecordsForWeek(){
  try{
    const rows = await apiGet({action:"records", weekStart: toDateStr(weekStart)});
    const next = {};
    rows.forEach(rec=>{
      const slotIdx = (parseInt(rec.slot) || 1) - 1;
      const key = rec.date+"|"+rec.block+"|"+slotIdx;
      next[key] = { status: rec.status||"normal", statusNote: rec.statusNote||"", attNote: rec.attNote||"",
        makeupDone: !!rec.makeupDone, makeupDate: rec.makeupDate||"",
        makeupStatus: rec.makeupStatus || (rec.makeupDone ? "done" : "none"),
        checkIn: rec.checkIn||"", checkOut: rec.checkOut||"" };
    });
    records = next;
  }catch(e){
    showSaveFailToast('출결 기록을 불러오지 못했어요. 새로고침해서 다시 시도해주세요.');
  }
}
function getRec(dateStr, block, slot){
  const key = dateStr+"|"+block+"|"+slot;
  return records[key] || {status:"normal", statusNote:"", attNote:"", makeupDone:false, makeupDate:"", makeupStatus:"none"};
}
function setRecLocal(dateStr, block, slot, rec){ records[dateStr+"|"+block+"|"+slot] = rec; }
async function pushRecord(dateStr, dayName, block, slot, rec){
  const body = { action:"saveRecord", record:{ date:dateStr, day:dayName, block:block, slot:slot+1,
    status:rec.status, hw:false, hwNote:"", attitude:!!rec.attNote,
    statusNote:rec.statusNote||"", attNote:rec.attNote||"",
    makeupDone: rec.makeupStatus === "done", makeupDate: rec.makeupDate||"",

    try{

    }
    await new Promise(r=>setTimeout(r, 3000));
  }finally{
    pendingSaveCount--;
  }
}
async function loadHomeworkForWeek(){

    const rows = await apiGet({action:"homework", weekStart: toDateStr(weekStart)});
    const next = {};
    rows.forEach(rec=>{
      const key = rec.date+"|"+rec.block+"|"+rec.name;
      next[key] = { completed: rec.completed||"미확인", memo: rec.memo||"" };

}
function getHwRec(dateStr, block, name){

}
function setHwRecLocal(dateStr, block, name, rec){ homeworkRecords[dateStr+"|"+block+"|"+name] = rec; }

async function loadWeekData(){

}
async function loadHolidays(){

    const thisYear = new Date().getFullYear();

/* ============ 동기화 상태 / 자동·수동 새로고침 ============ */
let lastSyncAt = null;
let autoRefreshTimer = null;
const AUTO_REFRESH_INTERVAL = 150000; // 2분 30초
function setSyncStatus(state){
  const dot = document.getElementById('syncDot');
  const text = document.getElementById('syncStatusText');
  if(!dot || !text) return;
  dot.classList.remove('busy','error');
  if(state === 'busy'){
    dot.classList.add('busy');
    text.textContent = '동기화 중';
  } else if(state === 'error'){

function syncStatusTick(){

let pendingSaveCount = 0;
function isUserEditing(){
  return editMode || !!openAttKey || !!openStatusKey || !!openHwMemoKey || pendingSaveCount > 0;
}
async function refreshData(auto){
  if(auto && isUserEditing()) return;
  let waited = 0;
  while(pendingSaveCount > 0 && waited < 3000){
    await new Promise(r=>setTimeout(r, 150));
    waited += 150;
  }
  setSyncStatus('busy');
  try{
    await loadRoster();
    await loadWeekData();
    if(!editMode){
      renderCardView();
      populateStudentSelect();
      if(selectedStudent) { await loadMonthRecords(); renderCalendar(); }
      if(currentPage === 'dashboard') renderDashboard();

async function pushRoster(prevSnapshot, effOverrides){
  const rows = [];
  DAYS.forEach(day=>{ BLOCKS.forEach(block=>{ roster[day][block].forEach((name, idx)=>{
    const prevNameRaw = prevSnapshot && prevSnapshot[day] && prevSnapshot[day][block] ? (prevSnapshot[day][block][idx] || "") : "";
    const prevName = String(prevNameRaw).trim();
    const curName = String(name || "").trim();
    if(curName !== prevName){
      const key = day+'|'+block+'|'+idx;
      const item = {day, block, slot: idx+1, name: curName};
      if(effOverrides && effOverrides[key]) item.effectiveFrom = effOverrides[key]; // 직접 지정한 시작일 — 없으면 서버가 오늘 날짜로 처리
      rows.push(item);
    }
  }); }); });
  if(!rows.length) return; // 실제로 바뀐 슬롯이 없으면 아무것도 보내지 않는다
  const body = {action:"saveRoster", roster: rows};
  pendingSaveCount++;
  try{
    try{
      await apiPost(body);
    }catch(e){
      try{ await apiPost(body); }
      catch(e2){ showSaveFailToast('명단 저장에 실패했어요. 인터넷 연결을 확인하고 다시 시도해주세요.'); }
    }
    await loadRoster(); // 새로 추가된 이력을 rosterHistory에 반영
  }finally{
    pendingSaveCount--;
  }
}

/* ============ 학생 목록 (roster 전체에서 고유 이름 추출) ============ */
// 같은 학생이 "종료"된 옛 슬롯과 새 슬롯에 이름/학교/학년/상태 형태로 각각 등록되어 있을 수 있으므로,
// 이름 기준으로 중복을 제거하고 대표 항목 하나만 남긴다 (종료되지 않은 슬롯을 우선한다).
function allStudentNames(){
  const byName = {};
  DAYS.forEach(day=>{ BLOCKS.forEach(block=>{ roster[day][block].forEach(n=>{
    if(!n || !n.trim()) return;
    const raw = n.trim();
    const stu = parseStudentEntry(raw);
    if(!stu.name) return;
    const prev = byName[stu.name];
    // 활성 슬롯(종료 아님)을 종료 슬롯보다 우선 채택. 아직 없으면 무조건 채택.
    if(!prev || (prev.status === '종료' && stu.status !== '종료')){
      byName[stu.name] = { raw, status: stu.status };
    }
  }); }); });
  return Object.values(byName).map(v=>v.raw).sort((a,b)=>a.localeCompare(b,'ko'));
}
function parseStudentEntry(raw){
  const parts = (raw||"").split("/").map(s=>s.trim());
  // 4번째 필드(status)는 "종료" 같은 상태 표시용 — 요일/시간을 옮긴 뒤에도
  // 예전 슬롯의 과거 출결 기록을 그대로 보존하기 위해, 이름은 바꾸지 않고
  // 이 필드만 붙여서 "지금은 안 쓰는 자리"라고 표시하는 용도로 쓴다.
  return { name: parts[0]||"", school: parts[1]||"", grade: parts[2]||"", status: parts[3]||"" };
}

async function loadMonthRecords(){
  monthRecords = {};
  if(!selectedStudent) return;
  const selectedName = parseStudentEntry(selectedStudent).name;
  const first = new Date(calMonth.getFullYear(), calMonth.getMonth(), 1);
  const last = new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 0);
  let cursor = mondayOf(first);
  const weeks = [];
  while(cursor <= last){
    weeks.push(new Date(cursor));
    cursor = addDays(cursor, 7);
  }
  for(const ws of weeks){
    try{
      const rows = await apiGet({action:"records", weekStart: toDateStr(ws)});
      rows.forEach(rec=>{
        const dayName = dayNameForDate(rec.date);
        const slotIdx = (parseInt(rec.slot)||1)-1;
        const slotRaw = rosterNameAt(dayName, rec.block, slotIdx, rec.date);
        const slotName = slotRaw ? parseStudentEntry(slotRaw).name : '';
        if(slotName && slotName === selectedName){
          monthRecords[rec.date] = rec.status;
        }
      });
    }catch(e){}
  }
}
function renderCalendar(){
  document.getElementById('calLabel').textContent = `${calMonth.getFullYear()}년 ${calMonth.getMonth()+1}월`;
  const grid = document.getElementById('calGrid');
  const dowNames = ["일","월","화","수","목","금","토"];
  let html = dowNames.map(d=>`<div class="cal-dow">${d}</div>`).join("");
  const first = new Date(calMonth.getFullYear(), calMonth.getMonth(), 1);
  const startPad = first.getDay();
  const daysInMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 0).getDate();
  for(let i=0;i<startPad;i++) html += `<div class="cal-cell pad"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const d = new Date(calMonth.getFullYear(), calMonth.getMonth(), day);
    const dateStr = toDateStr(d);
    const status = monthRecords[dateStr];
    let cls = "";
    if(status==='present') cls='present'; else if(status==='late') cls='late'; else if(status==='absent') cls='absent';
    html += `<div class="cal-cell ${cls}"><span class="dnum">${day}</span>${cls?'<span class="mark"></span>':''}</div>`;
  }
  grid.innerHTML = html;
}

function getRecordsCached(weekStart, cache){

  // 한 번도 펼친 적 없는 접힌 패널은 API를 호출하지 않는다 (사용자가 펼치는 순간 최초 1회 로드).

    const rows = (recordsByWeek[ws] || []).filter(r => r.date === dateStr);
    let total = 0, present = 0;

      for(let s=0; s<SUB; s++){
        const name = rosterNameAt(dayName, block, s, dateStr);

        total++;
        const rec = rows.find(r => r.block === block && String((parseInt(r.slot)||1)-1) === String(s));
        const status = rec ? rec.status : null;
        if(status === 'present' || status === 'late') present++;
      }
    });
    const rate = total ? Math.round((present/total)*100) : null;
    return { dateStr, dow: dowLabels[d.getDay()], rate, isToday: dateStr === toDateStr(today) };
  });

    </div>`;
  }).join('') + `</div>`;
}
async function renderHomeworkRank(cache){
  cache = cache || new Map();

  const today = new Date();
  const start = addDays(today, -27);
  let cursor = mondayOf(start);
  const weeks = [];
  while(cursor <= today){
    weeks.push(new Date(cursor));
    cursor = addDays(cursor, 7);
  }
  const countByName = {};
  const weekResults = await Promise.all(weeks.map(async ws=>{
    try{
      const [recordRows, hwRows] = await Promise.all([
        getRecordsCached(toDateStr(ws), cache),
        apiGet({action:"homework", weekStart: toDateStr(ws)})
      ]);
      return { recordRows, hwRows };
    }catch(e){ return null; }
  }));
  weekResults.forEach(res=>{
    if(!res) return;
    const { recordRows, hwRows } = res;
    hwRows.forEach(hw=>{
      if(hw.date < toDateStr(start) || hw.date > toDateStr(today)) return;
      const rawName = hw.name;
      if(!rawName) return;
      const dayName = dayNameForDate(hw.date);
      const isAbsent = recordRows.some(r => {
        if(r.date !== hw.date || r.block !== hw.block || r.status !== 'absent') return false;
        const slotIdx = (parseInt(r.slot)||1)-1;
        const slotName = rosterNameAt(dayName, r.block, slotIdx, r.date);
        return slotName && parseStudentEntry(slotName).name === parseStudentEntry(rawName).name;
      });
      if(isAbsent) return;
      const state = hwStatusLabel(hw.completed);
      if(state !== '미흡' && state !== '미확인') return;
      countByName[rawName] = (countByName[rawName] || 0) + 1;
    });
  });
  const ranked = Object.entries(countByName)
    .map(([rawName, count]) => ({ rawName, count }))
    .sort((a,b)=> b.count - a.count)
    .slice(0, 5);

    el.className = 'reason-feed';

    return;
  }
  el.className = 'compact-grid3';
  el.innerHTML = ranked.map(r=>{
    const stu = parseStudentEntry(r.rawName);
    const meta = [stu.school, stu.grade].filter(Boolean).join(' · ');
    return `<div class="cc-simple">
      <div class="cc-name">${stu.name}</div>
      ${meta?`<div class="cc-meta">${meta}</div>`:''}

    </div>`;
  }).join("");
}

function studentStatusOf(name){
  const found = studentInfoList.find(s => s.name === name);
  return found ? found.status : '재원';

function studentTextbookOf(name){

function slotsByStudent(){
  const map = {};
  DAYS.forEach(day=>{
    BLOCKS.forEach(block=>{
      roster[day][block].forEach(n=>{
        if(!n || !n.trim()) return;
        const key = n.trim();
        if(!map[key]) map[key] = [];
        map[key].push({day, block});
      });
    });
  });
  return map;
}

/* ============ 성적 관리 (초등 주간테스트/단원평가 + 중등 내신·쪽지시험 기록) ============ */
let gradesSelectedName = '';
let gradesActiveGroup = 'elem';
function gradeSortKey(stu){
  const school = (stu.school || '').trim();
  const levelRank = school.endsWith('초') ? 0 : school.endsWith('중') ? 1 : school.endsWith('고') ? 2 : 3;
  const m = (stu.grade || '').match(/\d+/);
  const gradeNum = m ? parseInt(m[0], 10) : 99;
  return levelRank * 100 + gradeNum;
}
function byGrade(a, b){
  return gradeSortKey(a.stu) - gradeSortKey(b.stu) || a.stu.name.localeCompare(b.stu.name, 'ko');
}
function elementaryStudents(){
  const names = allStudentNames();
  return names
    .map(raw => ({ raw, stu: parseStudentEntry(raw) }))
    .filter(item => /초$/.test((item.stu.school || '').trim()))
    .sort(byGrade);
}
function secondaryStudents(){
  const names = allStudentNames();
  return names
    .map(raw => ({ raw, stu: parseStudentEntry(raw) }))
    .filter(item => !/초$/.test((item.stu.school || '').trim()))
    .sort(byGrade);
}

        <div id="gradesMain"></div>

function fmtScore(score){
  const s = String(score == null ? '' : score).trim();
  if(!s) return '';
  if(s.indexOf('/') !== -1) return s;
  if(/^\d+(\.\d+)?$/.test(s)) return s + '점';
  return s;
}

async function renderTuitionList(){

  const summaryEl = document.getElementById('tuitionSummaryLine');
  if(!listEl) return;
  await loadStudentInfoList();
  const yearMonth = toYearMonth(tuitionMonth);
  let rows;
  try{
    rows = await apiGet({action:'tuition', yearMonth});
    if(!Array.isArray(rows)) rows = [];
    const rowByName = {};
    rows.forEach(r=>{ rowByName[r.name] = r; });
    const active = studentInfoList.filter(s=>s.status==='재원').sort((a,b)=>a.name.localeCompare(b.name,'ko'));
    if(!active.length){
      listEl.innerHTML = `<div class="tuition-list-empty">재원 중인 학생이 없어요.</div>`;
      if(summaryEl) summaryEl.textContent = '';
      return;
    }
    const paidCount = active.filter(s => rowByName[s.name] && rowByName[s.name].status === '완납').length;
    if(summaryEl){
      summaryEl.innerHTML = `완납 ${paidCount}명 · <span class="unpaid-count">미납 ${active.length - paidCount}명</span>`;
    }
    listEl.innerHTML = active.map(s=>{
      const rec = rowByName[s.name] || {};
      const status = rec.status === '완납' ? '완납' : '미납';
      const meta = [s.school, s.grade].filter(Boolean).join(' · ');
      return `<div class="tuition-row" data-name="${s.name}">
        <div>
          <div class="tr-name">${s.name}</div>
          ${meta ? `<div class="tr-meta">${meta}</div>` : ''}
        </div>
        <input type="number" class="tuition-amount" placeholder="금액" value="${rec.amount || ''}">

        <input type="date" class="tuition-paiddate" value="${rec.paidDate || ''}">

      </div>`;
    }).join('');

    listEl.innerHTML = `<div class="tuition-list-empty">불러오지 못했어요. 인터넷 연결을 확인해주세요.</div>`;
    if(summaryEl) summaryEl.textContent = '';
    return;
  }
  listEl.querySelectorAll('.tuition-status-toggle').forEach(btn=>{
    btn.onclick = ()=>{
      const next = btn.getAttribute('data-status') === '완납' ? '미납' : '완납';
      btn.setAttribute('data-status', next);
      btn.textContent = next;
      btn.classList.toggle('paid', next==='완납');
      btn.classList.toggle('unpaid', next==='미납');
      const row = btn.closest('.tuition-row');
      const dateInput = row.querySelector('.tuition-paiddate');
      if(next === '완납' && !dateInput.value) dateInput.value = toDateStr(new Date());
    };
  });
  listEl.querySelectorAll('.tuition-row-save').forEach(btn=>{
    btn.onclick = async ()=>{
      const row = btn.closest('.tuition-row');
      const name = row.getAttribute('data-name');
      const amount = row.querySelector('.tuition-amount').value.trim();
      const status = row.querySelector('.tuition-status-toggle').getAttribute('data-status');
      const paidDate = row.querySelector('.tuition-paiddate').value;
      const memo = row.querySelector('.tuition-memo').value.trim();
      btn.disabled = true;
      const original = btn.textContent;
      btn.textContent = '저장 중...';
      try{
        await apiPost({ action:'saveTuition', record:{ name, yearMonth, amount, status, paidDate, memo } });
        await new Promise(r=>setTimeout(r, 800));
        btn.textContent = '저장됨';
        setTimeout(()=>{ btn.textContent = original; btn.disabled = false; }, 1200);
      }catch(e){
        showSaveFailToast('수강료 저장에 실패했어요. 인터넷 연결을 확인해주세요.');
        btn.textContent = original;
        btn.disabled = false;
      }
    };
  });
}

const DASH_COLLAPSE_KEY = 'dashPanelCollapsed:';

function initDashCollapsibles(){
  document.querySelectorAll('.dash-collapsible').forEach(panel=>{
    const id = panel.dataset.panelId;
    const stored = localStorage.getItem(DASH_COLLAPSE_KEY + id);
    if(stored !== null){
      panel.classList.toggle('collapsed', stored === '1');
    }
    const head = panel.querySelector('.panel-head');
    head.onclick = ()=>{
      const collapsed = panel.classList.toggle('collapsed');
      try{ localStorage.setItem(DASH_COLLAPSE_KEY + id, collapsed ? '1' : '0'); }catch(e){}
      // 2026-09: 접혀 있던 패널을 처음 펼치는 순간 그 패널의 데이터만 1회 불러온다 (지연 로딩).

function pbLevelClass(lv){
  return lv === '3' ? 'level3' : lv === '2' ? 'level2' : 'level1';
}
const PB_GRADE_ORDER = ['중1','중2','중3','고1','고2','고3'];
const PB_SEMESTER_ORDER = ['1학기','2학기'];
function pbSortByOrder(values, order){
  return values.sort((a,b)=>{
    const ia = order.indexOf(a), ib = order.indexOf(b);
    if(ia === -1 && ib === -1) return a.localeCompare(b);
    if(ia === -1) return 1;
    if(ib === -1) return -1;
    return ia - ib;
  });
}
function populatePbUnitFilters(){
  const gradeSel = document.getElementById('pbFGrade');
  const semSel = document.getElementById('pbFSemester');
  const mainSel = document.getElementById('pbFUnitMain');
  const subSel = document.getElementById('pbFUnitSub');
  if(!mainSel || !subSel) return;
  const grades = pbSortByOrder([...new Set(pbProblems.map(p=>p.grade).filter(Boolean))], PB_GRADE_ORDER);
  const sems = pbSortByOrder([...new Set(pbProblems.map(p=>p.semester).filter(Boolean))], PB_SEMESTER_ORDER);
  // 대단원/소단원 옵션은 학년·학기를 먼저 고른 뒤 그 범위 안에 실제로 있는
  // 단원만 보여주도록 좁힌다 -- 예전엔 전체 문제은행 기준으로 옵션을
  // 만들어서, 중3·1학기를 선택해도 중2·2학기 단원(삼각형의 성질 등)까지
  // 같이 보이는 문제가 있었음 (2026-09-02)
  const curGrade = gradeSel ? gradeSel.value : '';
  const curSem = semSel ? semSel.value : '';
  const scoped = pbProblems.filter(p =>
    (!curGrade || p.grade === curGrade) && (!curSem || p.semester === curSem)
  );
  const mains = [...new Set(scoped.map(p=>p.unitMain).filter(Boolean))];
  const subs = [...new Set(scoped.map(p=>p.unitSub).filter(Boolean))];
  // 학년/학기 select 자체도 change 이벤트가 날 때마다 이 함수가 다시 불려서
  // 옵션을 새로 그리는데, innerHTML로 옵션을 통째로 갈아끼우면 select의
  // 현재 선택값이 첫 옵션("전체")으로 리셋돼버린다 -- 그러면 방금 고른
  // 학년/학기가 그 즉시 다시 "전체"로 풀려버리는 버그가 생기므로, 옵션을
  // 새로 그린 뒤 원래 선택값을 그대로 복원한다. (2026-09-02)
  if(gradeSel){
    gradeSel.innerHTML = '<option value="">전체</option>' + grades.map(g=>`<option value="${g}">${g}</option>`).join('');
    gradeSel.value = curGrade;
  }
  if(semSel){
    semSel.innerHTML = '<option value="">전체</option>' + sems.map(s=>`<option value="${s}">${s}</option>`).join('');
    semSel.value = curSem;
  }
  const prevMain = mainSel.value, prevSub = subSel.value;
  mainSel.innerHTML = '<option value="">전체</option>' + mains.map(m=>`<option value="${m}">${m}</option>`).join('');
  subSel.innerHTML = '<option value="">전체</option>' + subs.map(s=>`<option value="${s}">${s}</option>`).join('');
  // 이전 선택값이 새 범위에도 여전히 있으면 유지, 없으면(예: 학년을 바꿔서
  // 더 이상 해당 단원이 없어짐) "전체"로 초기화한다.
  mainSel.value = mains.includes(prevMain) ? prevMain : '';
  subSel.value = subs.includes(prevSub) ? prevSub : '';
}

function updatePbSticky(){

  const countEl = document.getElementById('pbSbCount');

function applyPbFilters(){
  const gEl = document.getElementById('pbFGrade');
  const semEl = document.getElementById('pbFSemester');
  const umEl = document.getElementById('pbFUnitMain');
  const usEl = document.getElementById('pbFUnitSub');
  const schoolEl = document.getElementById('pbFSchool');
  const hasSolEl = document.getElementById('pbFHasSol');
  if(!umEl || !usEl || !schoolEl || !hasSolEl) return;
  const grade = gEl ? gEl.value : '';
  const sem = semEl ? semEl.value : '';
  const um = umEl.value;
  const us = usEl.value;
  const levels = Array.from(document.querySelectorAll('#pbFLevel .chip.on')).map(c=>c.dataset.v);
  const types = Array.from(document.querySelectorAll('#pbFType .chip.on')).map(c=>c.dataset.v);
  const school = schoolEl.value.trim();
  const needSol = hasSolEl.checked;

  let visible = 0;
  pbProblems.forEach(p=>{
    const card = document.querySelector(`#pbGrid .pb-card[data-id="${p.id}"]`);
    if(!card) return;
    let ok = true;
    if(grade && p.grade !== grade) ok = false;
    if(sem && p.semester !== sem) ok = false;
    if(um && p.unitMain !== um) ok = false;
    if(us && p.unitSub !== us) ok = false;
    if(levels.length && !levels.includes(p.level)) ok = false;
    if(types.length && !types.includes(p.type)) ok = false;
    if(school && !(p.school||'').includes(school)) ok = false;
    if(needSol && !p.hasSolution) ok = false;
    card.classList.toggle('hidden', !ok);
    if(ok) visible++;
  });
  const vc = document.getElementById('pbVisibleCount');
  if(vc) vc.textContent = visible;
  updatePbSticky();
}

function buildPbPrintView(){
  if(pbSelected.size === 0){ alert('먼저 문제지에 넣을 문제를 선택해주세요.'); return; }
  const meta = {};
  pbProblems.forEach(p=>{ meta[p.id]=p; });
  const ids = Array.from(pbSelected).filter(id => meta[id]);
  const levelOrder = {'상':0,'중':1,'하':2};
  const mainUnits = [...new Set(ids.map(id=>meta[id].unitMain))].filter(Boolean);
  const subUnits = [...new Set(ids.map(id=>meta[id].unitSub))].filter(Boolean);
  const levels = [...new Set(ids.map(id=>meta[id].level))].filter(Boolean)
    .sort((a,b)=>(levelOrder[a]??9)-(levelOrder[b]??9));

  let html = '';
  html += `
    <div class="ws-page ws-cover">
      <div class="ws-cover-title">${mainUnits.join(' / ')}</div>
      <div class="ws-cover-sub2">${subUnits.join(' · ')}</div>
      <div class="ws-cover-levels">${levels.map(l=>`<span class="ws-level-chip lv-${l}">${l}</span>`).join('')}</div>
      <div class="ws-cover-sub">${new Date().toLocaleDateString('ko-KR')} · 총 ${ids.length}문항</div>
      <div class="ws-cover-note">※ 배점 표시는 자동 집계하지 않았어요 — 각 문항 이미지 하단의 [N점] 표기를 참고해주세요.</div>
      <div class="ws-cover-fields">
        <div class="ws-field">이름</div>
        <div class="ws-field">날짜</div>
      </div>
      <div class="ws-cover-logo"><img src="${PB_WORDMARK_URL}"></div>
    </div>`;

  html += `<div class="ws-section-label">문제지</div>`;
  for(let i=0;i<ids.length;i+=4){
    const chunk = ids.slice(i,i+4);
    html += `<div class="ws-page ws-worksheet">
      <div class="ws-head"><span>수학 · ${mainUnits.join('/')}</span></div>
      <div class="ws-grid">`;
    chunk.forEach((id,k)=>{
      html += `<div class="ws-slot">
        <div class="ws-badge">${i+k+1}</div>
        <img src="${meta[id].printUrl}">
      </div>`;
    });
    for(let k=chunk.length;k<4;k++) html += `<div class="ws-slot ws-empty"></div>`;
    html += `</div>${pbFooterHTML(Math.floor(i/4)+1, '수학의 결')}</div>`;
  }

  const withSol = ids.filter(id => meta[id].solutionPrintUrls && meta[id].solutionPrintUrls.length);
  if(withSol.length){
    html += `<div class="ws-section-label">해설지 (교사용 · 배포 전 분리)</div>`;
    html += `<div class="ws-page ws-solution"><div class="ws-head"><span>수학 · 선택 문제 해설</span></div><div class="ws-sol-flow">`;
    ids.forEach((id,k)=>{
      if(!meta[id].solutionPrintUrls || !meta[id].solutionPrintUrls.length) return;
      html += `<div class="ws-sol-item"><div class="ws-badge sm">${k+1}</div>`;
      meta[id].solutionPrintUrls.forEach(u=>{
        html += `<img src="${u}">`;
      });
      html += `</div>`;
    });
    html += `</div>${pbFooterHTML('', '교사용 · 배포 전 분리')}</div>`;
  }

  document.getElementById('pbPrintPages').innerHTML = html;
  document.getElementById('pbPrintView').classList.add('show');
}

/* ============ 당겨서 새로고침(pull-to-refresh) ============ */
(function setupPullToRefresh(){
  const content = document.getElementById('pageContent');
  const indicator = document.getElementById('ptrIndicator');
  const indicatorText = document.getElementById('ptrIndicatorText');
  if(!content || !indicator) return;
  const THRESHOLD = 64;
  const MAX_PULL = 100;
  let startY = 0;
  let pulling = false;
  let dragging = false;
  let refreshing = false;
  function atTop(){
    return window.scrollY <= 0 && content.scrollTop <= 0;
  }
  content.addEventListener('touchstart', (e)=>{
    if(refreshing) return;
    if(!atTop()) { pulling = false; return; }
    startY = e.touches[0].clientY;
    pulling = true;
    dragging = false;
  }, {passive:true});
  content.addEventListener('touchmove', (e)=>{
    if(!pulling || refreshing) return;
    const dy = e.touches[0].clientY - startY;
    if(dy <= 0){
      indicator.style.height = '0px';
      indicator.classList.remove('ready');
      dragging = false;
      return;
    }
    if(!atTop()) return;
    dragging = true;
    const pull = Math.min(dy * 0.5, MAX_PULL);
    indicator.style.height = pull + 'px';
    if(pull >= THRESHOLD){
      indicator.classList.add('ready');
      indicatorText.textContent = '놓으면 새로고침';
    } else {
      indicator.classList.remove('ready');
      indicatorText.textContent = '아래로 당겨서 새로고침';
    }
  }, {passive:true});
  content.addEventListener('touchend', async ()=>{
    if(!pulling) return;
    pulling = false;
    const pullHeight = parseFloat(indicator.style.height) || 0;
    if(dragging && pullHeight >= THRESHOLD && !refreshing){
      refreshing = true;
      indicator.style.height = '48px';
      indicator.classList.remove('ready');
      indicator.classList.add('loading');
      indicatorText.textContent = '새로고침 중...';
      await refreshData(false);
      indicator.classList.remove('loading');
      indicator.style.height = '0px';
      indicatorText.textContent = '아래로 당겨서 새로고침';
      refreshing = false;
    } else {
      indicator.style.height = '0px';
      indicator.classList.remove('ready');
    }
    dragging = false;
  });
})();

/* ============ 색상 테마 ============ */
// 기본 테마(딥그린)는 CSS 원래 값 그대로. 다른 색을 고르면 그 색 하나로부터
// 사이드바는 아이보리로 고정, 나머지 버튼(--teal)/진한 강조(--deep)/진한 글자(--teal-dark)/연한 배경(--soft)을 자동 계산한다.
// 저장된 색은 시트의 "설정" 탭(action=settings)에 두어 모든 기기에서 같은 색이 보이고,
// 로딩 순간의 깜빡임을 줄이기 위해 localStorage에도 마지막 값을 캐시해 둔다.
const THEME_DEFAULT = '#0C4642';
const THEME_PRESETS = [
  { hex:'#0C4642', label:'딥틸(기본)' },
  { hex:'#224F42', label:'틸' },
  { hex:'#0F3D3A', label:'짙은 틸' },
  { hex:'#155E52', label:'포레스트 틸' },
  { hex:'#018875', label:'밝은 틸' },
  { hex:'#027A94', label:'청록' },
  { hex:'#2F5D8A', label:'남색' },
  { hex:'#5B4B8A', label:'보라' },
  { hex:'#8A5A2B', label:'브라운' },
  { hex:'#37474F', label:'먹색' }
];
const THEME_LS_KEY = 'ikk_theme_color';
let themeCurrent = THEME_DEFAULT;   // 저장돼 있는(적용 중인) 색
let themePreview = THEME_DEFAULT;   // 모달에서 고르는 중인 색

function themeHexToRgb_(hex){
  const h = String(hex||'').replace('#','');
  if(!/^[0-9a-fA-F]{6}$/.test(h)) return null;
  const n = parseInt(h,16);
  return [n>>16&255, n>>8&255, n&255];
}
function themeRgbToHex_(r,g,b){
  return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('').toUpperCase();
}
function themeMix_(hex, target, ratio){ // hex를 target(0=검정,255=흰색)쪽으로 ratio만큼 섞음
  const c = themeHexToRgb_(hex); if(!c) return hex;
  return themeRgbToHex_(...c.map(v=>v+(target-v)*ratio));
}
function themeIsLight_(hex){
  const c = themeHexToRgb_(hex); if(!c) return false;
  const lum = (0.2126*c[0]+0.7152*c[1]+0.0722*c[2])/255;
  return lum > 0.55;
}
function themeSetLightness_(hex, l){ // hex의 색상(hue)·채도는 유지하고 밝기(lightness)만 l(0~1)로 고정
  const c = themeHexToRgb_(hex); if(!c) return hex;
  let [r,g,b] = c.map(v=>v/255);
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let h = 0, s = 0;
  const d = max - min;
  if(d !== 0){
    s = d / (1 - Math.abs(max + min - 1));
    switch(max){
      case r: h = ((g-b)/d) % 6; break;
      case g: h = (b-r)/d + 2; break;
      default: h = (r-g)/d + 4;
    }
    h *= 60; if(h < 0) h += 360;
  }
  // HSL -> RGB (l, s 는 0~1)
  const cc = (1 - Math.abs(2*l - 1)) * s;
  const x = cc * (1 - Math.abs((h/60) % 2 - 1));
  const m = l - cc/2;
  let r2=0,g2=0,b2=0;
  if(h<60){r2=cc;g2=x;b2=0;} else if(h<120){r2=x;g2=cc;b2=0;}
  else if(h<180){r2=0;g2=cc;b2=x;} else if(h<240){r2=0;g2=x;b2=cc;}
  else if(h<300){r2=x;g2=0;b2=cc;} else {r2=cc;g2=0;b2=x;}
  return themeRgbToHex_((r2+m)*255,(g2+m)*255,(b2+m)*255);
}
function applyTheme(hex){
  const root = document.documentElement.style;
  const valid = themeHexToRgb_(hex) ? hex.toUpperCase() : THEME_DEFAULT;
  if(valid === THEME_DEFAULT){
    // 기본 테마: CSS에 적힌 원래 값으로 되돌린다 (사이드바 관련 값만 — 메인 화면 배경/카드는 아래에서 항상 다시 계산)
    ['--deep','--teal','--teal-dark','--soft','--side-fg','--side-fg-soft','--side-fg-dim','--deep-rgb','--teal-rgb'].forEach(k=>root.removeProperty(k));
  }else{
    root.setProperty('--deep', valid);
    const tealHex = themeMix_(valid, 255, 0.12);
    root.setProperty('--teal', tealHex);
    root.setProperty('--teal-dark', themeMix_(valid, 0, 0.12));
    root.setProperty('--soft', themeMix_(valid, 255, 0.88));
    // 사이드바 유리 배경 그라데이션도 테마색을 따라가도록 r,g,b 값을 같이 갱신
    const deepRgb = themeHexToRgb_(valid);
    if(deepRgb) root.setProperty('--deep-rgb', deepRgb.join(','));
    const tealRgb = themeHexToRgb_(tealHex);
    if(tealRgb) root.setProperty('--teal-rgb', tealRgb.join(','));
    // 사이드바 배경(--deep)이 테마색을 그대로 쓰므로, 밝은 색을 고르면 글자색도 어둡게 자동 전환한다
    if(themeIsLight_(valid)){
      root.setProperty('--side-fg', '#2E2A1F');
      root.setProperty('--side-fg-soft', 'rgba(46,42,31,.72)');
      root.setProperty('--side-fg-dim', 'rgba(46,42,31,.5)');
    }else{
      root.setProperty('--side-fg', '#FFFFFF');
      root.setProperty('--side-fg-soft', 'rgba(255,255,255,.72)');
      root.setProperty('--side-fg-dim', 'rgba(255,255,255,.5)');
    }
  }
  // 메인(오른쪽) 화면은 사이드바 테마색과 상관없이 항상 기존에 쓰던 밝은 크림톤(--paper/--card 기본값) 유지
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', valid);
  return valid;
}
function themeSetPreview_(hex){
  themePreview = applyTheme(hex);
  const input = document.getElementById('themeColorInput');
  if(input) input.value = themePreview;
  const hexEl = document.getElementById('themeHex');
  if(hexEl) hexEl.textContent = themePreview;
  document.querySelectorAll('#themeSwatches .tm-sw').forEach(b=>{
    b.classList.toggle('on', b.getAttribute('data-hex').toUpperCase() === themePreview);
  });
  const warn = document.getElementById('themeWarn');
  if(warn) warn.classList.toggle('show', themeIsLight_(themePreview));
}
function openThemeModal(){
  const wrap = document.getElementById('themeSwatches');
  if(wrap && !wrap.children.length){
    wrap.innerHTML = THEME_PRESETS.map(p=>
      `<button type="button" class="tm-sw" data-hex="${p.hex}"><i style="background:${p.hex}"></i><span>${p.label}</span></button>`
    ).join('');
    wrap.querySelectorAll('.tm-sw').forEach(b=>{ b.onclick = ()=> themeSetPreview_(b.getAttribute('data-hex')); });
  }
  themeSetPreview_(themeCurrent);
  document.getElementById('themeModal').classList.add('open');
  const overlay = document.getElementById('mobileMenuOverlay');
  if(overlay) overlay.classList.remove('open');
}
function closeThemeModal(revert){
  if(revert) applyTheme(themeCurrent);
  document.getElementById('themeModal').classList.remove('open');
}
async function saveTheme(){
  const btn = document.getElementById('themeSave');
  btn.disabled = true; btn.textContent = '저장 중…';
  try{
    await apiPost({ action:'saveSettings', settings:{ themeColor: themePreview } });
    themeCurrent = themePreview;
    try{ localStorage.setItem(THEME_LS_KEY, themeCurrent); }catch(e){}
    closeThemeModal(false);
  }catch(e){
    alert('색상 저장에 실패했어요. 네트워크를 확인하고 다시 시도해주세요.');
  }finally{
    btn.disabled = false; btn.textContent = '저장';
  }
}
async function loadTheme(){
  try{
    const data = await apiGet({action:'settings'});
    const hex = data && data.themeColor ? String(data.themeColor) : THEME_DEFAULT;
    themeCurrent = applyTheme(hex);
    try{ localStorage.setItem(THEME_LS_KEY, themeCurrent); }catch(e){}
  }catch(e){
    // 설정을 못 읽어도 캐시된 색(또는 기본 색)으로 계속 동작
  }
}
// 캐시된 색을 먼저 칠해 두고(깜빡임 방지), 실제 값은 loadTheme()에서 시트 기준으로 다시 맞춘다
try{
  const cached = localStorage.getItem(THEME_LS_KEY);
  if(cached){ themeCurrent = applyTheme(cached); }
}catch(e){}
document.querySelectorAll('[data-theme-open]').forEach(b=>{ b.onclick = openThemeModal; });
document.getElementById('themeClose').onclick = ()=> closeThemeModal(true);
document.getElementById('themeCancel').onclick = ()=> closeThemeModal(true);
document.getElementById('themeSave').onclick = saveTheme;
document.getElementById('themeModal').addEventListener('click', e=>{ if(e.target.id==='themeModal') closeThemeModal(true); });
document.getElementById('themeColorInput').addEventListener('input', e=> themeSetPreview_(e.target.value));
